<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Life Planner</title>
<meta name="theme-color" content="#2b5c8a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --bg:#f4f3ef; --panel:#ffffff; --panel2:#f9f8f5; --ink:#1c1c1e; --muted:#66666c; --line:#e1dfd8;
  --accent:#2b5c8a; --accent-ink:#ffffff; --bad:#b23d1c; --good:#2a7a4a; --warn:#a86a00;
  --routine:#6f7887; --meal:#c48a10; --lse:#7445b0; --study:#2d6cb0; --academy:#11877a; --gym:#c4443a;
  --business:#2b8a4c; --travel:#8b9099; --chores:#9b6530; --free:#a8a397; --admin:#4c5c8e;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121316; --panel:#1b1d21; --panel2:#202227; --ink:#ebebee; --muted:#9b9da4; --line:#2d3036;
    --accent:#80b2e3; --accent-ink:#0d1b29; --bad:#f07c5c; --good:#6cc28f; --warn:#e3b04f;
    --routine:#9aa3b2; --meal:#e0a93a; --lse:#a77ee0; --study:#6aa2e0; --academy:#3fb9aa; --gym:#e8746a;
    --business:#5cbf7d; --travel:#9aa0aa; --chores:#c99055; --free:#8d887d; --admin:#8596cc;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121316; --panel:#1b1d21; --panel2:#202227; --ink:#ebebee; --muted:#9b9da4; --line:#2d3036;
  --accent:#80b2e3; --accent-ink:#0d1b29; --bad:#f07c5c; --good:#6cc28f; --warn:#e3b04f;
  --routine:#9aa3b2; --meal:#e0a93a; --lse:#a77ee0; --study:#6aa2e0; --academy:#3fb9aa; --gym:#e8746a;
  --business:#5cbf7d; --travel:#9aa0aa; --chores:#c99055; --free:#8d887d; --admin:#8596cc;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
.muted{color:var(--muted)}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* header */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:58px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.logo{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800}
.brand .name{font-weight:700}
.brand .sub{font-size:12.5px;color:var(--muted)}
.clock{font-weight:600;font-size:14px}
.tabs{display:flex;gap:2px;overflow-x:auto;padding:6px 0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:7px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:550;white-space:nowrap}
.tabs button:hover{background:var(--panel2);color:var(--ink)}
.tabs button[aria-current="page"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow);outline:1px solid var(--line)}
.pill{display:inline-block;min-width:18px;padding:0 6px;margin-left:4px;border-radius:9px;background:var(--bad);color:#fff;font-size:11.5px;line-height:18px;text-align:center}
.pill:empty{display:none}

main{padding:18px 0 60px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.card+.card{margin-top:14px}
.card h2{font-size:15px;margin-bottom:10px}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:9px;cursor:pointer;font-weight:550}
.btn:hover{border-color:color-mix(in srgb,var(--ink) 30%,var(--line))}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:4px 9px;font-size:13px}
.btn.danger{color:var(--bad)}
.row-flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* day bar */
.daybar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.daybar h1{font-size:22px}
.daybar h1 span{color:var(--muted);font-weight:500}
.navbtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:18px;line-height:1}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}

/* category colour hook */
.c-routine{--c:var(--routine)} .c-meal{--c:var(--meal)} .c-lse{--c:var(--lse)} .c-study{--c:var(--study)}
.c-academy{--c:var(--academy)} .c-gym{--c:var(--gym)} .c-business{--c:var(--business)} .c-travel{--c:var(--travel)}
.c-chores{--c:var(--chores)} .c-free{--c:var(--free)} .c-admin{--c:var(--admin)}

/* now card */
.now{border-radius:16px;padding:18px 18px 16px;margin-bottom:16px;background:color-mix(in srgb,var(--c,var(--accent)) 12%,var(--panel));border:1px solid color-mix(in srgb,var(--c,var(--accent)) 35%,var(--line))}
.now .lbl{font-size:12.5px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:color-mix(in srgb,var(--c,var(--accent)) 75%,var(--ink))}
.now .big{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:4px 0 6px;line-height:1.2}
.now p{margin:0 0 10px;color:var(--muted)}
.prog{height:6px;border-radius:3px;background:color-mix(in srgb,var(--c,var(--accent)) 18%,transparent);overflow:hidden;margin:6px 0 12px}
.prog i{display:block;height:100%;background:var(--c,var(--accent))}
.nowfoot{display:flex;gap:12px;align-items:center;flex-wrap:wrap}

/* timeline */
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:96px minmax(0,1fr) 34px;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:8px 10px 8px 12px;cursor:pointer}
.row:hover{border-color:color-mix(in srgb,var(--c) 50%,var(--line));border-left-color:var(--c)}
.row .time{font-size:13px;color:var(--muted);font-weight:550}
.row .ttl{font-weight:600}
.row .note{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.c-free{background:transparent;border-style:dashed;border-left-style:solid}
.row.c-free .ttl{font-weight:500;color:var(--muted)}
.row.c-travel{background:transparent}
.row.cur{background:color-mix(in srgb,var(--c) 10%,var(--panel));outline:2px solid color-mix(in srgb,var(--c) 60%,transparent)}
.row.past:not(.cur){opacity:.72}
.row.done .ttl{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--ink) 35%,transparent)}
.tag{display:inline-block;font-size:11px;font-weight:650;padding:1px 6px;border-radius:5px;background:var(--panel2);color:var(--muted);vertical-align:1px;margin-left:4px;border:1px solid var(--line)}
.tag.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.chk{width:32px;height:32px;border-radius:50%;border:2px solid color-mix(in srgb,var(--c) 55%,var(--line));background:transparent;cursor:pointer;color:transparent;font-weight:800;font-size:15px;display:grid;place-items:center}
.chk:hover{color:color-mix(in srgb,var(--c) 60%,transparent)}
.chk.on{background:var(--c);border-color:var(--c);color:#fff}
.chk.none{border:0;cursor:default}

/* side stats */
.stat{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.stat:first-of-type{border-top:0}
.stat b{font-size:20px;min-width:28px}
.stat.bad b{color:var(--bad)} .stat.good b{color:var(--good)} .stat.warn b{color:var(--warn)}
.stat .grow{flex:1}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:112px 1fr 96px;gap:8px;align-items:center;font-size:13.5px}
.bar .track{height:8px;border-radius:4px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--c,var(--accent))}
.bar .v{text-align:right;color:var(--muted)}
.due{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}
.due:first-of-type{border-top:0}
.due .when{grid-column:2;color:var(--muted);font-size:12.5px}
.due.over .when{color:var(--bad);font-weight:600}
.code{font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px;background:var(--panel2);border:1px solid var(--line);height:fit-content;letter-spacing:.02em}

/* week grid */
.wkhead{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.wkhead h1{font-size:22px}
.wk{display:grid;grid-template-columns:48px repeat(7,minmax(0,1fr));background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.wk .dh{padding:8px 6px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);font-size:13px;font-weight:650;text-align:center}
.wk .dh small{display:block;color:var(--muted);font-weight:500}
.wk .dh.today{color:var(--accent)}
.wk .gut{position:relative;border-right:1px solid var(--line)}
.wk .gut span{position:absolute;right:6px;font-size:11px;color:var(--muted);transform:translateY(-6px)}
.wk .col{position:relative;border-left:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 46px}
.wk .col.today{background-color:color-mix(in srgb,var(--accent) 4%,transparent)}
.blk{position:absolute;left:3px;right:3px;border-radius:6px;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 16%,var(--panel));font-size:11.5px;line-height:1.25;padding:2px 5px;overflow:hidden;cursor:pointer}
.blk.c-free{background:transparent;border-left-style:dotted;color:var(--muted)}
.blk.c-travel{background:repeating-linear-gradient(135deg,transparent 0 5px,color-mix(in srgb,var(--c) 14%,transparent) 5px 10px)}
.blk b{font-weight:650;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk.tiny{padding:0 5px;font-size:9.5px;line-height:1.1}
.blk.tiny b{font-weight:600}
.blk .t{color:var(--muted);font-size:10.5px}
.blk.done::after{content:"✓";position:absolute;right:4px;top:2px;font-weight:800;color:var(--c)}
.blk.missed{outline:1px dashed color-mix(in srgb,var(--bad) 60%,transparent)}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--bad);z-index:3}
.nowline::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.wklist{display:none}
@media (max-width:820px){.wk{display:none}.wklist{display:block}.wklist h3{margin:16px 0 8px;font-size:15px}}
.legend{display:flex;flex-wrap:wrap;gap:10px 14px;margin-top:12px;font-size:12.5px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:5px;vertical-align:-1px}

/* catch-up / deadlines lists */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;color:var(--muted);font-weight:550}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.wkgroup{margin-top:18px}
.wkgroup h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:8px}
.lrow{display:grid;grid-template-columns:150px 70px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:6px}
.lrow .d{font-size:13px;color:var(--muted)}
.lrow.behind{border-left:4px solid var(--bad)}
.lrow.future{opacity:.55}
.tg{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:4px 9px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted)}
.tg.on{background:var(--good);border-color:var(--good);color:#fff}
@media (max-width:640px){.lrow{grid-template-columns:1fr auto}.lrow .d,.lrow .code{grid-column:1}}
.drow{display:grid;grid-template-columns:34px 64px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:6px}
.drow .t{font-weight:600}
.drow .n{font-size:12.5px;color:var(--muted)}
.drow .w{font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.drow.over{border-left:4px solid var(--bad)} .drow.over .w{color:var(--bad);font-weight:650}
.drow.soon .w{color:var(--warn);font-weight:650}
.drow.isdone{opacity:.55}.drow.isdone .t{text-decoration:line-through}
.drow .chk{--c:var(--good)}
@media (max-width:640px){.drow{grid-template-columns:34px minmax(0,1fr)}.drow .code{display:none}.drow .w{grid-column:2;text-align:left}}
.form{display:grid;grid-template-columns:130px minmax(0,1fr) 150px 110px auto;gap:8px}
.form input,.form select,textarea{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 9px;min-width:0}
@media (max-width:760px){.form{grid-template-columns:1fr 1fr}.form .wide{grid-column:1/-1}}
h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 0 8px}

/* food */
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
.cols>.card+.card{margin-top:0}
@media (max-width:820px){.cols{grid-template-columns:1fr}}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-top:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-top:0}
.tablewrap{overflow-x:auto}
.shop{list-style:none;margin:0;padding:0}
.shop li{display:flex;align-items:center;gap:9px;padding:6px 0;border-top:1px solid var(--line)}
.shop li:first-child{border-top:0}
.shop input{width:18px;height:18px;accent-color:var(--good)}
.shop li.got span{text-decoration:line-through;color:var(--muted)}
.shop .x{margin-left:auto;border:0;background:none;color:var(--muted);cursor:pointer}
.prose p{margin:0 0 10px}.prose ul{margin:0 0 10px;padding-left:20px}.prose li{margin:3px 0}

/* overlays */
.banner{position:fixed;left:50%;transform:translateX(-50%);top:70px;z-index:50;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:min(560px,calc(100% - 32px));cursor:pointer}
.banner b{display:block;font-size:16px}
.night{position:fixed;inset:0;z-index:100;background:rgba(8,9,12,.94);color:#f1f1f3;display:grid;place-items:center;padding:24px}
.night .box{max-width:460px;text-align:center}
.night .clockbig{font-size:64px;font-weight:300;letter-spacing:-.03em}
.night h2{font-size:26px;margin:6px 0 10px}
.night p{color:#b9bac2;margin:0 0 22px}
.night .btn{background:transparent;color:#f1f1f3;border-color:#4a4c55}
.night .btn.primary{background:#f1f1f3;color:#111;border-color:#f1f1f3}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--ink);padding:0;max-width:min(480px,calc(100% - 32px));width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.35)}
.dlg{padding:18px;border-top:5px solid var(--c,var(--accent))}
.dlg h3{font-size:19px;margin:2px 0 4px}
.dlg p{margin:10px 0}
.dlg .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;z-index:60;font-size:14px}
.welcome{background:color-mix(in srgb,var(--accent) 9%,var(--panel));border-color:color-mix(in srgb,var(--accent) 30%,var(--line));margin-bottom:16px}
.welcome ul{margin:6px 0 12px;padding-left:20px}
textarea{width:100%;min-height:90px;font-family:ui-monospace,Consolas,monospace;font-size:12px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 0;border-top:1px solid var(--line)}
.card h2+.sw{border-top:0}
.sw small{display:block;color:var(--muted);font-size:12.5px}
.tog{position:relative;width:46px;height:28px;border-radius:14px;border:0;background:var(--line);cursor:pointer;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.tog[aria-checked="true"]{background:var(--good)}
.tog[aria-checked="true"]::after{left:21px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:16px;padding:5px 11px;cursor:pointer;font-size:13px;font-weight:550;color:var(--muted)}
.chip[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 18%,var(--panel));border-color:var(--c);color:var(--ink)}
.update{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));z-index:70;background:var(--panel);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.2);border-radius:12px;padding:10px 12px 10px 16px;display:flex;gap:12px;align-items:center;white-space:nowrap}
main{padding-bottom:calc(60px + env(safe-area-inset-bottom))}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><div class="logo">✓</div><div><div class="name">Life Planner</div><div class="sub" id="periodLbl"></div></div></div>
    <button class="btn small primary" id="installBtn" hidden>Install app</button>
    <div class="clock" id="clock"></div>
  </div>
  <div class="wrap">
    <nav class="tabs" id="tabs" aria-label="Sections">
      <button data-tab="today">Today</button>
      <button data-tab="week">Week</button>
      <button data-tab="catch">Catch-up<span class="pill" id="pillCatch"></span></button>
      <button data-tab="deadlines">Deadlines<span class="pill" id="pillDl"></span></button>
      <button data-tab="food">Food</button>
      <button data-tab="setup">Setup</button>
    </nav>
  </div>
</header>
<main class="wrap" id="view"></main>
<div class="banner" id="banner" hidden></div>
<div class="night" id="night" hidden>
  <div class="box">
    <div class="clockbig" id="nightClock"></div>
    <h2 id="nightHead"></h2>
    <p id="nightText"></p>
    <div class="row-flex" style="justify-content:center">
      <button class="btn primary" id="nightGo"></button>
      <button class="btn" id="nightSnooze"></button>
    </div>
  </div>
</div>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" hidden></div>
<div class="update" id="updateBar" hidden><span>A new version is ready.</span><button class="btn small primary" id="updateGo">Update</button></div>

<script>
(function(){
'use strict';

/* ================= time helpers ================= */
const params = new URLSearchParams(location.search);
let OFFSET = 0;
if (params.get('now')) { const t = new Date(params.get('now')); if (!isNaN(t)) OFFSET = t.getTime() - Date.now(); }
const now = () => new Date(Date.now() + OFFSET);
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const dOf = s => { const a = s.split('-').map(Number); return new Date(a[0], a[1] - 1, a[2]); };
const addD = (s, n) => { const d = dOf(s); d.setDate(d.getDate() + n); return iso(d); };
const dow = s => dOf(s).getDay();
const hm = s => { const a = s.split(':').map(Number); return a[0] * 60 + a[1]; };
const tm = m => pad(Math.floor(m / 60)) + ':' + pad(m % 60);
const at = (s, m) => { const a = s.split('-').map(Number); return new Date(a[0], a[1] - 1, a[2], Math.floor(m / 60), m % 60); };

/* ================= build a day ================= */
const overlap = (a, b) => a.s < b.e && b.s < a.e;
const cache = new Map();
const CONFLICTS = [];
function dayBlocks(d){
  if (cache.has(d)) return cache.get(d);
  const p = periodOf(d), w = dow(d), ss = sessionsOn(d);
  const campus = ss.some(x => x.kind === 'class' || x.kind === 'workshop');
  const ctx = {campus, p, d};
  const out = [], busy = [];
  for (const x of ss){
    if (x.kind === 'help') continue;
    const inPerson = campus && x.kind !== 'qa';
    let t = x.label, n = 'In person.';
    if (x.kind === 'lecture'){ t += inPerson ? ' · in person' : ' · watch at home'; n = inPerson ? N.inperson : N.watch; }
    if (x.kind === 'qa') n = N.qa;
    const b = {s:x.s, e:x.e, cat:'lse', t, n, id:x.id, sess:x, opt:x.kind === 'qa'};
    out.push(b); busy.push(b);
  }
  let leave = null;
  if (campus){
    const ip = ss.filter(x => x.kind === 'lecture' || x.kind === 'class' || x.kind === 'workshop');
    const first = Math.min(...ip.map(x => x.s)), last = Math.max(...ip.map(x => x.e));
    const t1 = {s:first - 45, e:first - 5, cat:'travel', t:'Cycle to campus', n:N.travel};
    const t2 = {s:last, e:last + 40, cat:'travel', t:'Cycle home', n:N.travel};
    leave = t1.s; out.push(t1, t2); busy.push(t1, t2);
  }
  let tpl;
  if (HOLIDAYS[d]) tpl = T.HOLIDAY(d);
  else if (w === 6) tpl = T.SAT(d, ctx, p);
  else if (w === 0) tpl = T.SUN(d, ctx, p);
  else tpl = T[p.tpl](d, ctx, p, w);
  tpl = [WAKE(), ...tpl, WIND()].filter(b => !(b.campusOnly && !campus) && !(b.homeOnly && campus))
    .map(b => (typeof b.t === 'function' ? o(b, {t:b.t(d, ctx)}) : b));
  for (const b of tpl.filter(b => !b.flex && !b.move)){
    if (busy.some(x => overlap(b, x))) CONFLICTS.push(d + ' fixed ' + tm(b.s) + ' ' + b.t);
    out.push(b); busy.push(b);
  }
  for (const b0 of tpl.filter(b => b.move)){
    const b = o(b0), len = b.e - b.s; let g = 0, hit;
    while ((hit = busy.find(x => overlap(b, x))) && g++ < 8){ b.s = hit.e; b.e = hit.e + len; b.moved = true; }
    if (busy.some(x => overlap(b, x)) || b.e > 22 * 60 + 30) CONFLICTS.push(d + ' move ' + tm(b0.s) + ' ' + b.t);
    out.push(b); busy.push(b);
  }
  for (const b of tpl.filter(b => b.flex)){
    let pieces = [[b.s, b.e]];
    for (const x of busy){
      pieces = pieces.flatMap(([a, z]) => (x.e <= a || x.s >= z) ? [[a, z]] : [[a, Math.max(a, x.s)], [Math.min(z, x.e), z]].filter(([p1, q]) => q > p1));
    }
    const untouched = pieces.length === 1 && pieces[0][0] === b.s && pieces[0][1] === b.e;
    for (const [a, z] of pieces) if (untouched || z - a >= 25) out.push(o(b, {s:a, e:z}));
  }
  out.sort((a, b) => a.s - b.s || a.e - b.e);
  for (const b of out) if (!b.id) b.id = 'b|' + d + '|' + tm(b.s) + '|' + b.cat;
  const res = out; res.campus = campus; res.leave = leave;
  cache.set(d, res);
  return res;
}

function weekStats(ws){
  const r = {gym:{d:0,p:0}, study:{d:0,p:0}, academy:{d:0,p:0}, business:{d:0,p:0}, bed:{d:0,p:0}, wake:{d:0,p:0}};

      if (b.cat === 'study' || b.cat === 'academy' || b.cat === 'business'){ if (!b.opt) r[b.cat].p += dur; if (done) r[b.cat].d += dur; }
      if (b.tk && b.s === 22 * 60 + 30){ if (d < t || (d === t && m >= 23 * 60)) r.bed.p++; if (done) r.bed.d++; }

}

    const bl = dayBlocks(d).map(b => {

/* ================= CATCH-UP ================= */
function renderCatch(){
  const n = now();
  let list = ALLSESS.filter(x => x.kind === 'lecture' || x.kind === 'help' || x.kind === 'class' || x.kind === 'workshop');
  const isPast = x => at(x.date, x.e) <= n;
  if (catchFilter === 'behind') list = list.filter(x => x.kind === 'lecture' && isPast(x) && !S.done[x.id]);
  else if (catchFilter === 'past') list = list.filter(isPast);
  const beh = behindLectures(), h = beh.reduce((a, x) => a + (x.e - x.s) / 60, 0);
  const notesDue = ALLSESS.filter(x => x.kind === 'lecture' && isPast(x) && S.done[x.id] && !S.notes[x.id]).length;
  const groups = {};
  for (const x of list){ const k = weekStart(x.date); (groups[k] = groups[k] || []).push(x); }
  const keys = Object.keys(groups).sort();
  const row = x => {
    const past = isPast(x), done = !!S.done[x.id], behind = x.kind === 'lecture' && past && !done;
    const inPerson = dayBlocks(x.date).campus && x.kind !== 'help';
    const verb = x.kind === 'class' || x.kind === 'workshop' ? 'Attended' : (inPerson ? 'Attended' : 'Watched');
    return '<div class="lrow' + (behind ? ' behind' : '') + (past ? '' : ' future') + '"><span class="d">' + dayName(x.date, true) + ' ' + niceDate(x.date).replace(/ (\w{3})\w*$/, ' $1') + ' · ' + tm(x.s) + '</span>' +
      '<span class="code">' + x.code + '</span><span>' + esc(x.label) + (x.kind === 'help' ? ' <span class="tag">optional</span>' : '') + ' <span class="muted">· ' + hrs((x.e - x.s) / 60) + '</span></span>' +
      '<span class="row-flex"><button class="tg' + (done ? ' on' : '') + '" data-act="tick" data-id="' + esc(x.id) + '">' + verb + '</button>' +
      (x.kind === 'lecture' || x.kind === 'help' ? '<button class="tg' + (S.notes[x.id] ? ' on' : '') + '" data-act="note" data-id="' + esc(x.id) + '">Notes</button>' : '') + '</span></div>';

  view.innerHTML = '<section class="daybar"><div><h1>Catch-up</h1><div class="muted">' +
    (beh.length ? beh.length + ' lecture' + (beh.length === 1 ? '' : 's') + ' behind, ' + hrs(h) + ' of watching. Clear the oldest first, in Sunday\'s catch-up block or any study block.' : 'Up to date on lectures.') +
    (notesDue ? ' ' + notesDue + ' watched lecture' + (notesDue === 1 ? ' still needs' : 's still need') + ' notes.' : '') + '</div></div></section>' +
    '<div class="seg">' + seg('behind', 'Behind') + seg('past', 'All so far') + seg('all', 'Whole year') + '</div>' +
    (keys.length ? keys.map(k => '<div class="wkgroup"><h3>Week of ' + niceDate(k) + ' · ' + esc(periodOf(k).name) + '</h3>' + groups[k].map(row).join('') + '</div>').join('')

}

function importText(txt){
  try {
    const obj = JSON.parse(txt);
    if (!obj || typeof obj !== 'object' || !obj.done) throw new Error('bad');
    S = normalise(obj); save(); cache.clear(); toast('Backup imported.'); render();
  } catch(e) { toast('That is not a planner backup.'); }
}
function exportBackup(){
  S.lastBackup = today(); save();
  const blob = new Blob([JSON.stringify(S)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = today() + '_Planner_Backup.json';
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
  toast('Saved as ' + a.download + '. Move it to OneDrive › Planner › Backups.');
  if (TAB === 'setup') renderSetup();
}

document.addEventListener('click', e => {
  unlockAudio();
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  if (a === 'tick'){ e.stopPropagation(); const id = el.dataset.id; if (S.done[id]) delete S.done[id]; else S.done[id] = true; save(); if (el.dataset.close) $('#dlg').close(); render(); return; }
  if (a === 'open'){ openBlock(el.dataset.d, el.dataset.id); return; }
  if (a === 'close'){ $('#dlg').close(); return; }
  if (a === 'note'){ const id = el.dataset.id; if (S.notes[id]) delete S.notes[id]; else S.notes[id] = true; save(); render(); return; }
  if (a === 'go'){ setTab(el.dataset.tab); return; }
  if (a === 'welcomed'){ S.welcomed = true; save(); render(); return; }
  if (a === 'dprev' || a === 'dnext'){ viewDay = addD(viewDay || today(), a === 'dprev' ? -1 : 1); if (viewDay === today()) viewDay = null; render(); return; }
  if (a === 'dtoday'){ viewDay = null; render(); return; }
  if (a === 'wprev' || a === 'wnext'){ viewWeek = addD(viewWeek || weekStart(today()), a === 'wprev' ? -7 : 7); render(); return; }
  if (a === 'wtoday'){ viewWeek = null; render(); return; }
  if (a === 'cfilter'){ catchFilter = el.dataset.f; render(); return; }
  if (a === 'dlfilter'){ dlFilter = el.dataset.f; render(); return; }
  if (a === 'dltick'){ const k = 'd|' + el.dataset.id; if (S.done[k]) delete S.done[k]; else S.done[k] = true; save(); render(); return; }
  if (a === 'dldel'){ if (confirm('Delete this deadline?')){ S.custom = S.custom.filter(x => x.id !== el.dataset.id); save(); render(); } return; }
  if (a === 'shop'){ const k = el.dataset.k; if (el.checked) S.shop[k] = true; else delete S.shop[k]; save(); el.closest('li').classList.toggle('got', el.checked); return; }
  if (a === 'shopdel'){ S.shopExtra[el.dataset.l].splice(+el.dataset.i, 1); Object.keys(S.shop).filter(k => k.startsWith(el.dataset.l + 'x')).forEach(k => delete S.shop[k]); save(); renderFood(); return; }
  if (a === 'shopclear'){ Object.keys(S.shop).filter(k => k.startsWith(el.dataset.l)).forEach(k => delete S.shop[k]); save(); renderFood(); return; }
  if (a === 'export'){ exportBackup(); return; }
  if (a === 'copy'){ const txt = JSON.stringify(S); const ta = $('#impText'); ta.value = txt; ta.select();
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast('Copied. Paste it into a note in OneDrive › Planner › Backups.'), () => toast('Selected in the box below. Press Ctrl+C.')); return; }
  if (a === 'importText'){ importText($('#impText').value); return; }
  if (a === 'tog'){
    const k = el.dataset.k;
    if (k === 'system' && !S.alerts.system){
      if (!('Notification' in window)){ toast('Notifications are not available here.'); return; }
      if (Notification.permission === 'denied'){ toast('Notifications are blocked for this app in your settings.'); return; }
      if (Notification.permission === 'default'){ Notification.requestPermission().then(pm => { S.alerts.system = pm === 'granted'; save(); render(); }); return; }
    }
    S.alerts[k] = !S.alerts[k]; save(); render(); return; }
  if (a === 'bed'){ S.alerts.bedtime = el.dataset.v; save(); nightMode = null; renderSetup(); checkNight(); return; }
  if (a === 'cat'){ const c = el.dataset.c; S.alerts.cats[c] = !S.alerts.cats[c]; save(); renderSetup(); return; }
  if (a === 'install'){ doInstall(); return; }
  if (a === 'testalert'){ alertUser('Test alert', 'This is what a block starting looks like.', true); return; }
  if (a === 'reset'){ if (confirm('Clear every tick, note and shopping tick? Deadlines you added stay.')){ S.done = {}; S.notes = {}; S.shop = {}; S.nights = {}; save(); render(); } return; }
});
document.querySelectorAll('#tabs button').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
$('#dlg').addEventListener('click', e => { if (e.target === $('#dlg')) $('#dlg').close(); });

/* ================= alerts ================= */
let AC = null, SWREG = null, deferredInstall = null;
function unlockAudio(){ if (!S.alerts.sound) return; try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch(e) {} }
function chime(){
  if (!S.alerts.sound) return;
  unlockAudio(); if (!AC) return;
  try { const t0 = AC.currentTime; [660, 880].forEach((f, i) => { const os = AC.createOscillator(), g = AC.createGain(); os.type = 'sine'; os.frequency.value = f;
    g.gain.setValueAtTime(0, t0 + i * .18); g.gain.linearRampToValueAtTime(.18, t0 + i * .18 + .02); g.gain.exponentialRampToValueAtTime(.001, t0 + i * .18 + .5);
    os.connect(g).connect(AC.destination); os.start(t0 + i * .18); os.stop(t0 + i * .18 + .55); }); } catch(e) {}
}
function notifySystem(title, body, force){
  const A = S.alerts;
  if (!A.system || !('Notification' in window) || Notification.permission !== 'granted') return;
  if (!force && document.visibilityState === 'visible' && document.hasFocus()) return;
  const opts = {body, icon:'icons/icon-192.png', badge:'icons/icon-192.png', tag:'planner', renotify:true, silent:!A.sound && !A.vibrate};
  if (A.vibrate) opts.vibrate = [180, 90, 180];
  if (SWREG && SWREG.showNotification) SWREG.showNotification(title, opts).catch(() => {});
  else { try { new Notification(title, opts); } catch(e) {} }
}
function alertUser(title, body, force){
  const A = S.alerts;
  if (A.banner || force){
    const bn = $('#banner'); bn.innerHTML = '<b>' + esc(title) + '</b>' + esc(body); bn.hidden = false;
    clearTimeout(alertUser.t); alertUser.t = setTimeout(() => bn.hidden = true, 60000);
    document.title = '● ' + title;
    clearTimeout(alertUser.tt); alertUser.tt = setTimeout(() => document.title = 'Life Planner', 90000);
  }
  chime();
  notifySystem(title, body, force);
}
$('#banner').addEventListener('click', () => { $('#banner').hidden = true; document.title = 'Life Planner'; });
const alerted = new Set();
function primeAlerts(){ const m = nowM(); for (const b of dayBlocks(today())) if (b.s <= m) alerted.add(today() + b.id + 's'); }
function checkAlerts(){
  const t = today(), m = nowM(), A = S.alerts;
  for (const b of dayBlocks(t)){
    if (b.cat === 'travel'){
      if (A.leave && b.t === 'Cycle to campus' && m >= b.s - 5 && m < b.s && !alerted.has(t + b.id + 'p')){
        alerted.add(t + b.id + 'p'); alertUser('Leave in ' + (b.s - m) + ' min', 'Cycle to campus at ' + tm(b.s) + '.');
      }
      continue;
    }
    if (A.cats[b.cat] && m >= b.s && m < b.s + 3 && !alerted.has(t + b.id + 's')){
      alerted.add(t + b.id + 's'); alertUser('Now: ' + b.t, 'Until ' + tm(b.e) + '.');
    }
  }
}

/* ================= night lock ================= */
function nightDate(){ const n = now(); return n.getHours() < 5 ? iso(new Date(n.getFullYear(), n.getMonth(), n.getDate() - 1)) : iso(n); }
let nightMode = null; const nightSent = new Set();
function checkNight(){
  const n = now(), m = n.getHours() * 60 + n.getMinutes(), nd = nightDate();
  const windId = 'b|' + nd + '|22:30|routine';
  let mode = null;
  if (!S.done[windId] && !(S.nights[nd] && S.nights[nd].bed) && Date.now() + OFFSET >= (S.snoozeUntil || 0)){
    if (m >= 22 * 60 + 30 && m < 23 * 60) mode = 'soft';
    else if (m >= 23 * 60 || n.getHours() < 5) mode = 'hard';
  }
  const ov = $('#night'), B2 = S.alerts.bedtime;
  if (!mode || B2 === 'off'){ ov.hidden = true; nightMode = null; return; }
  const head = mode === 'soft' ? 'Wind down' : 'It\'s past 11pm', text = mode === 'soft' ? 'Laptop shut by 23:00. Up at 07:00.' : 'Close the laptop and go to bed.';
  if (B2 === 'notify'){ ov.hidden = true; if (!nightSent.has(nd + mode)){ nightSent.add(nd + mode); alertUser(head, text); } return; }
  if (!nightSent.has(nd + mode)){ nightSent.add(nd + mode); notifySystem(head, text); }
  $('#nightClock').textContent = tm(m);
  if (mode !== nightMode){
    nightMode = mode;
    if (mode === 'soft'){
      $('#nightHead').textContent = 'Wind down.'; $('#nightText').textContent = 'Laptop shut by 23:00. Lay out tomorrow, then read. Up at 07:00.';
      $('#nightGo').textContent = 'Shutting down now'; $('#nightSnooze').textContent = '10 more minutes';
    } else {
      $('#nightHead').textContent = 'It\'s past 11pm.'; $('#nightText').textContent = 'Sleep is guardrail 1. Close the laptop now. Anything unfinished goes in tomorrow\'s first study block.';
      $('#nightGo').textContent = 'I\'m going to bed'; $('#nightSnooze').textContent = '5 more minutes (counts as a late night)';
    }
    chime();
  }
  ov.hidden = false;
}
$('#nightGo').addEventListener('click', () => {
  const n = now(), m = n.getHours() * 60 + n.getMinutes(), nd = nightDate();
  const onTime = n.getHours() >= 5 && m <= 23 * 60 + 10;
  S.nights[nd] = o(S.nights[nd] || {}, {bed:tm(m), late:!onTime || !!(S.nights[nd] && S.nights[nd].late)});
  if (onTime && !S.nights[nd].late) S.done['b|' + nd + '|22:30|routine'] = true;
  save(); $('#night').hidden = true; nightMode = null; render();
});
$('#nightSnooze').addEventListener('click', () => {
  const nd = nightDate(), hard = nightMode === 'hard';
  if (hard) S.nights[nd] = o(S.nights[nd] || {}, {late:true});
  S.snoozeUntil = Date.now() + OFFSET + (hard ? 5 : 10) * 6e4; save();
  $('#night').hidden = true; nightMode = null;
});

/* ================= loop ================= */
let lastMin = -1;
function loop(){
  const m = nowM();
  checkAlerts(); checkNight();
  if (m !== lastMin){ lastMin = m; updateChrome(); if (TAB === 'today' && !$('#dlg').open) renderToday(); }
}

/* ================= boot ================= */
load();
const startTab = (location.hash || '').slice(1);
setTab(['today','week','catch','deadlines','food','setup'].includes(startTab) ? startTab : 'today');
primeAlerts();
lastMin = nowM();
checkNight();
setInterval(loop, 15000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) loop(); });
if (S.lastVersion !== APP_VERSION){ if (S.lastVersion) toast('Updated to version ' + APP_VERSION + '.'); S.lastVersion = APP_VERSION; save(); }
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch(e) {}

/* ================= installable app ================= */
let wantReload = false;
function showUpdate(reg){
  $('#updateBar').hidden = false;
  $('#updateGo').onclick = () => { wantReload = true; if (reg.waiting) reg.waiting.postMessage('skip'); else location.reload(); };
}
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)){
  navigator.serviceWorker.register('./sw.js').then(reg => {
    SWREG = reg;
    if (reg.waiting && navigator.serviceWorker.controller) showUpdate(reg);
    reg.addEventListener('updatefound', () => { const w = reg.installing; if (w) w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) showUpdate(reg); }); });
    setInterval(() => reg.update().catch(() => {}), 60 * 60 * 1000);
  }).catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (wantReload){ wantReload = false; location.reload(); } });
}
function doInstall(){
  if (!deferredInstall){ toast('Use your browser menu: Install app.'); return; }
  deferredInstall.prompt();
  deferredInstall.userChoice.finally(() => { deferredInstall = null; $('#installBtn').hidden = true; if (TAB === 'setup') renderSetup(); });
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; $('#installBtn').hidden = false; if (TAB === 'setup') renderSetup(); });
window.addEventListener('appinstalled', () => { deferredInstall = null; $('#installBtn').hidden = true; toast('Installed. Open it from its icon.'); });
$('#installBtn').addEventListener('click', doInstall);

/* test hook */
window.__planner = {
  selfTest(){
    CONFLICTS.length = 0; cache.clear();
    for (let d = '2026-09-28'; d <= '2027-09-26'; d = addD(d, 1)) dayBlocks(d);
    const dowBad = ALLSESS.filter(x => dow(x.date) !== x.wd).map(x => x.id);
    const overlaps = [];
    for (let d = '2026-10-11'; d <= '2027-09-26'; d = addD(d, 1)){
      const bl = dayBlocks(d);
      for (let i = 0; i < bl.length; i++) for (let j = i + 1; j < bl.length; j++)
        if (overlap(bl[i], bl[j]) && !(bl[i].opt || bl[j].opt)) overlaps.push(d + ' ' + tm(bl[i].s) + ' ' + bl[i].t + ' × ' + tm(bl[j].s) + ' ' + bl[j].t);
    }
    return {conflicts: CONFLICTS.slice(), dowBad, overlaps, sessions: ALLSESS.length, deadlines: DL.length};
  },
  weekHours(ws){ const sums = {}; for (let i = 0; i < 7; i++) for (const b of dayBlocks(addD(ws, i))) if (!b.opt) sums[b.cat] = (sums[b.cat] || 0) + (b.e - b.s) / 60; return sums; },
  day: d => dayBlocks(d).map(b => tm(b.s) + '-' + tm(b.e) + ' [' + b.cat + '] ' + b.t)
};
})();
</script>
