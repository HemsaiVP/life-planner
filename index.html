<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Slate</title>
<meta name="theme-color" content="#EEF1F0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/slate-192.png">
<link rel="apple-touch-icon" href="icons/slate-touch-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ================= Board: whiteboard by day, chalkboard by night (DESIGN.md) ================= */
:root{
  --board:#EEF1F0; --sheet:#F8FAF9; --ink:#1A1D23; --ink-2:#4F5661; --rule:#D3D9D8; --rule-soft:rgba(26,29,35,.09); --hi:#FFE14A;
  --field:rgba(255,255,255,.72); --field-line:#4F5661; --btn-line:#1A1D23; --wash:rgba(26,29,35,.05); --dash:rgba(26,29,35,.28);
  --frame:#1A1D23; --frame-bg:rgba(255,255,255,.45); --cell:rgba(255,255,255,.55);
  --lse:#6A3BA3; --study:#1E4FC2; --academy:#0C7C78; --gym:#CC2F2A; --business:#1F7F45; --career:#D2600F;
  --meal:#8A5A1F; --chores:#8A5A1F; --admin:#263C78; --routine:#66707A; --travel:#66707A; --free:#66707A;
  --y:#FFE97A; --b:#CBE6FF; --p:#FFC9D9; --g:#CFEFBF;
  --bad:#CC2F2A; --good:#1A7340; --warn:#A34A0B; --hint:#1E4FC2; --teal-text:#0A6E6A; --on-mark:#FFFFFF;
  --note-shadow:0 10px 14px -10px rgba(26,29,35,.45);
  --r1:18px 22px 16px 24px / 20px 16px 24px 18px; --r2:14px 18px 13px 17px / 16px 13px 18px 14px;
  --r3:12px 16px 11px 15px / 14px 11px 16px 12px; --r4:13px 10px 14px 9px / 10px 13px 9px 14px;
  /* older names the code still uses */
  --bg:var(--board); --panel:var(--sheet); --panel2:var(--field); --muted:var(--ink-2); --line:var(--rule); --accent:var(--study); --soft-ink:var(--hint);
  color-scheme:light;
}
:root[data-board="night"]{
  --board:#1D2925; --sheet:#24332E; --ink:#EEEDE4; --ink-2:#B8C3BD; --rule:rgba(238,237,228,.14); --rule-soft:rgba(238,237,228,.08); --hi:#F3E38D;
  --field:rgba(238,237,228,.06); --field-line:rgba(238,237,228,.5); --btn-line:rgba(238,237,228,.55); --wash:rgba(238,237,228,.06); --dash:rgba(238,237,228,.3);
  --frame:rgba(238,237,228,.75); --frame-bg:rgba(238,237,228,.025); --cell:rgba(238,237,228,.04);
  --lse:#C8B5F3; --study:#9DC8F2; --academy:#8BD8CC; --gym:#F3A29E; --business:#A6DB98; --career:#F5B77A;
  --meal:#DDBB8C; --chores:#DDBB8C; --admin:#AFB9F0; --routine:#A9B4AE; --travel:#A9B4AE; --free:#A9B4AE;
  --bad:#F3A29E; --good:#A6DB98; --warn:#F5B77A; --hint:#9DC8F2; --teal-text:#8BD8CC; --on-mark:#1D2925;
  --note-shadow:none;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;overflow-x:clip}
body{background:var(--board);color:var(--ink);font:400 16px/1.45 "Atkinson Hyperlegible",sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(118deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.75) 46%,rgba(255,255,255,0) 62%),radial-gradient(120% 60% at 85% -10%,rgba(30,79,194,.05),rgba(30,79,194,0) 60%),var(--board)}
:root[data-board="night"] body::before{
  background:radial-gradient(60% 40% at 18% 12%,rgba(238,237,228,.06),rgba(238,237,228,0) 70%),radial-gradient(50% 35% at 88% 72%,rgba(238,237,228,.05),rgba(238,237,228,0) 70%),
    linear-gradient(100deg,rgba(238,237,228,0) 18%,rgba(238,237,228,.045) 28%,rgba(238,237,228,0) 44%),linear-gradient(97deg,rgba(238,237,228,0) 58%,rgba(238,237,228,.035) 66%,rgba(238,237,228,0) 80%),var(--board)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:700}
.muted{color:var(--ink-2)}
.small{font-size:14px}
a{color:var(--study)}
.hand{font-family:Kalam,cursive;font-weight:700}

/* marker colour hook: one colour per kind of block */
.c-routine{--c:var(--routine)} .c-meal{--c:var(--meal)} .c-lse{--c:var(--lse)} .c-study{--c:var(--study)}
.c-academy{--c:var(--academy)} .c-gym{--c:var(--gym)} .c-business{--c:var(--business)} .c-travel{--c:var(--travel)}
.c-chores{--c:var(--chores)} .c-free{--c:var(--free)} .c-admin{--c:var(--admin)} .c-career{--c:var(--career)}

/* ---------- shell ---------- */
#app{min-height:100vh;min-height:100dvh}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}
main.wrap{position:relative;padding:6px 18px calc(130px + env(safe-area-inset-bottom))}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 0 2px}
.topbar>div:first-child{min-width:0}
.topbar h1{font-family:Kalam,cursive;font-weight:700;font-size:46px;line-height:1.05;white-space:nowrap}
.topbar h1.adate{font-family:inherit;font-size:16px;line-height:21px}
.topbar .sub{color:var(--ink-2);font-size:14.5px;line-height:20px;margin-top:4px}
.tb-acts{flex-direction:column;align-items:flex-end;flex:none}
.aclock{font-family:Kalam,cursive;font-weight:700;font-size:32px;line-height:34px}
.pillbtn{flex:none;min-height:44px;padding:0 14px;border:2px solid var(--btn-line);border-radius:var(--r1);background:transparent;color:var(--ink);font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pillbtn:hover{background:var(--wash)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* bottom navigation: drawn icons, a marker underline on the current tab */
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));padding:4px 4px calc(6px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--board) 95%,transparent);border-top:1.5px solid var(--rule)}
.bottomnav button{position:relative;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:62px;padding:4px 0 0;color:var(--ink-2);font-size:12px}
.bottomnav button[aria-current="page"]{color:var(--ink);font-weight:700}
.ul{display:block;width:40px;height:7px;fill:none;stroke:var(--tabc,var(--study));stroke-width:2.6;stroke-linecap:round;visibility:hidden}
.bottomnav button[aria-current="page"] .ul{visibility:visible}
:root[data-board="night"] .ul,:root[data-board="night"] .ul2{stroke:var(--hi)}
.badge{position:absolute;top:2px;left:50%;margin-left:5px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--bad);color:var(--on-mark);font-size:11px;font-weight:700;line-height:19px;text-align:center}
.badge:empty{display:none}

/* layout C: sidebar and desk */
body.L-C .wrap{max-width:1360px}
body.L-C #app{display:grid;grid-template-columns:236px minmax(0,1fr)}
body.L-C main.wrap{width:100%;padding:24px 30px 90px}
body.L-C .topbar h1{font-size:56px;line-height:1.05}
body.L-C .topbar h1.adate{font-size:16px;line-height:21px}
.sidenav{position:sticky;top:0;height:100vh;height:100dvh;padding:26px 16px 20px;border-right:1.5px solid var(--rule);display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.sidenav .brand{padding:0 8px 18px}
.sidenav .brand .bn{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.sidenav .brand img{width:36px;height:36px;border-radius:22%;flex:none}
.sidenav .brand b{display:block;font-family:Kalam,cursive;font-weight:700;font-size:28px;line-height:32px}
.sidenav .clock{font-size:13px;color:var(--ink-2)}
.sidenav button.nav{position:relative;display:flex;align-items:center;gap:12px;min-height:44px;border:0;background:none;padding:0 10px;color:var(--ink-2);font-size:15px;text-align:left}
.sidenav button.nav:hover{color:var(--ink)}
.sidenav button.nav[aria-current="page"]{color:var(--ink);font-weight:700}
.sidenav .lbl{position:relative}
.ul2{position:absolute;left:-4px;bottom:-9px;width:calc(100% + 8px);height:8px;fill:none;stroke:var(--tabc,var(--study));stroke-width:2.6;stroke-linecap:round}
.sidenav .badge{position:static;margin-left:auto}
.sidenav .spacer{flex:1;min-height:20px}
.sidenav .btn{justify-content:flex-start;margin-top:6px}
@media (max-width:860px){
  body.L-C #app{display:block}
  body.L-C .sidenav{position:sticky;top:0;z-index:30;height:auto;flex-direction:row;overflow-x:auto;padding:6px 8px;border-right:0;border-bottom:1.5px solid var(--rule);background:var(--board)}
  body.L-C .sidenav .brand,body.L-C .sidenav .spacer,body.L-C .sidenav .btn{display:none}
  body.L-C .sidenav button.nav{white-space:nowrap;padding:0 10px}
}
.dash{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) minmax(0,.95fr);gap:30px;align-items:start}
.dash>div{display:flex;flex-direction:column;gap:30px;min-width:0}
.dash .agenda{margin-top:0}
.dash .focus{margin-top:0}
@media (max-width:1180px){.dash{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}.dash>div:nth-child(3){grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}}
@media (max-width:760px){.dash{grid-template-columns:1fr}.dash>div:nth-child(3){display:flex}}

/* ---------- sections written straight on the board ---------- */
.card{padding:0;margin:0;background:none;border:0}
.card+.card{margin-top:30px}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:30px;align-items:start}
.cols>div{display:flex;flex-direction:column;gap:30px;min-width:0}
.dash .card+.card,.cols .card+.card{margin-top:0}
@media (max-width:900px){.cols{grid-template-columns:1fr}}
body:not(.L-C) .cols{grid-template-columns:1fr}
.card h2{font-size:17px;line-height:22px;margin:0 0 4px;padding-bottom:7px;border-bottom:1.5px solid var(--rule);display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.card h2 .r{font-size:14px;font-weight:400;color:var(--ink-2);text-align:right}
.card h2 .r.hand{font-family:Kalam,cursive;font-weight:700;font-size:19px}
.sec{font-size:14px;font-weight:400;color:var(--ink-2);margin:22px 0 8px}
.frame{border:2px solid var(--frame);border-radius:var(--r1);background:var(--frame-bg);padding:16px 18px}
.paper{position:relative;margin-top:20px;padding:18px 16px 14px;background:var(--y);color:#1A1D23;border-radius:2px 3px 2px 3px;box-shadow:var(--note-shadow);transform:rotate(-.4deg)}
.paper::before{content:"";position:absolute;top:-7px;left:50%;width:15px;height:15px;margin-left:-7px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7D9CF0,#1E4FC2 68%);box-shadow:0 2px 3px rgba(0,0,0,.3)}
.paper h2{font-size:17px;margin:0 0 6px}
.paper.pink{background:var(--p)}
.paper.pink::before{background:radial-gradient(circle at 35% 30%,#F08B83,#CC2F2A 68%)}
:root[data-board="night"] .paper.pink{background:transparent;border-color:rgba(243,162,158,.75)}
.steps{padding-left:20px;margin:8px 0 0}
.ctab{width:100%;border-collapse:collapse;font-size:15px;margin:10px 0 4px}
.ctab th,.ctab td{padding:7px 6px;border-top:1.5px solid var(--rule);text-align:right;font-variant-numeric:tabular-nums}
.ctab th{font-size:13.5px;color:var(--ink-2);border-top:0}
.ctab td:first-child,.ctab th:first-child{text-align:left}
.paper .btn{border-color:#1A1D23;color:#1A1D23}
.paper .btn.primary{background:#1A1D23;color:#FFE97A}
:root[data-board="night"] .paper{background:transparent;color:var(--ink);border:2px solid rgba(243,227,141,.7);border-radius:var(--r1);transform:none}
:root[data-board="night"] .paper::before{display:none}
:root[data-board="night"] .paper .btn{border-color:var(--btn-line);color:var(--ink)}
:root[data-board="night"] .paper .btn.primary{background:var(--ink);color:var(--board)}

/* buttons: filled black marker, or a drawn outline */
.btn{min-height:44px;padding:8px 16px;border:2px solid var(--btn-line);border-radius:var(--r2);background:transparent;color:var(--ink);font-weight:700;font-size:15px;line-height:1.2;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn:hover{background:var(--wash)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--board)}
.btn.primary:hover{background:var(--ink);opacity:.92}
.btn.soft{border-color:var(--c,var(--study))}
.btn.small{padding:4px 12px;font-size:14px;border-radius:var(--r3)}
.btn.sq{width:44px;padding:0}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.dashed{border-style:dashed}
.btn.wide{width:100%}
.btn:disabled{opacity:.4;cursor:default}
.btn:disabled:hover{background:transparent}
.row-flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
.tag{display:inline-block;font-size:12.5px;font-weight:700;padding:0 7px;line-height:20px;border:1.5px solid var(--rule);border-radius:var(--r3);color:var(--ink-2);vertical-align:1px;margin-left:6px}
.tag.bad{color:var(--bad);border-color:var(--bad)}
.tag.warn{color:var(--warn);border-color:var(--warn)}
.tag.good{color:var(--good);border-color:var(--good)}
/* 4.6: lecture tracker. Each week in its own hand-drawn box; its heading stays in view while you scroll that week.
   One set of markup, three widths: phone = a line per session with the buttons under it, narrow laptop window = buttons on the right,
   laptop = a column per weekday and a card per session. */
.termh{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin:14px 0 4px}
.termh .hand{font-size:32px;line-height:1.1}
.tsum{font-size:14.5px;line-height:20px;color:var(--ink-2)}
.wbox{container:wbox/inline-size;border:2px solid var(--rule);border-radius:var(--r1);padding:0 14px 6px;margin-top:16px}
.wbox:nth-of-type(2n){border-radius:var(--r2)}
.wbox.now{border-color:var(--lse)}
.whead{position:sticky;top:0;z-index:3;background:var(--board);list-style:none;cursor:pointer;display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;padding:12px 0 10px}
.whead::-webkit-details-marker{display:none}
.wbox[open]>.whead{border-bottom:2px solid var(--rule)}
.wn{font-size:27px;line-height:1}
.wdates{font-size:14.5px;color:var(--ink-2)}
.wsum{margin-left:auto;display:flex;align-items:baseline;gap:8px;font-size:14.5px;color:var(--ink-2)}
.wsum .hand{font-size:20px;color:var(--ink)}
.wst.good{color:var(--good);font-weight:700}
.wbox .ticks{margin-top:0;flex-wrap:wrap}
.wbox .tk{padding:4px 11px}
@container wbox (max-width:420px){ .wbox .lg{display:none} .wbox .ticks{gap:4px} .wbox .tk{padding:4px 8px;font-size:13px;gap:3px} .wbox .tk svg{width:14px;height:14px} }
/* phone: a line per session, the day on the left */
.dgrp{container:dgrp/inline-size;display:grid;grid-template-columns:44px minmax(0,1fr);column-gap:10px}
.dgrp.empty{display:none}
.dgrp:not(.empty)~.dgrp{border-top:2px solid var(--rule)}
.dname{display:flex;flex-direction:column;line-height:1.05;padding-top:10px}
.dname b{font-size:13px;color:var(--ink-2)}
.dname .hand{font-size:24px}
.dnone{margin:0;font-size:13.5px;color:var(--ink-2)}
.sess{display:grid;row-gap:8px;padding:10px 0}
.sess+.sess{border-top:1.5px solid var(--rule-soft)}
.sinfo{min-width:0}
.sinfo .l1{font-size:15.5px;line-height:21px}
.sinfo small{display:block;font-size:13.5px;line-height:18px;color:var(--ink-2)}
.sess.done>*{opacity:.55}
.sess.done .sinfo b{text-decoration:line-through;text-decoration-color:var(--lse);text-decoration-thickness:2px}
.sess.up>*{opacity:.65}
/* narrow laptop window: the buttons move to the right of the session */
@container wbox (min-width:600px){
  .dgrp{grid-template-columns:56px minmax(0,1fr)}
  .sess{grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:12px}
}
/* laptop: the week as a board, a column per weekday, a card per session */
@container wbox (min-width:820px){
  .wdays{display:grid;grid-template-columns:repeat(var(--nd,5),minmax(0,1fr));gap:14px;padding:12px 0 6px}
  .dgrp,.dgrp.empty{display:block}
  .dgrp:not(.empty)~.dgrp{border-top:0}
  .dname{flex-direction:row;align-items:baseline;gap:6px;margin-bottom:8px;padding-top:0}
  .dgrp.empty .dname{opacity:.55}
  .sess{display:flex;flex-direction:column;align-items:stretch;gap:3px;border:2px solid var(--rule);border-radius:var(--r3);padding:10px 10px 12px;margin-bottom:10px}
  .sess+.sess{border-top:2px solid var(--rule)}
  .dlist .sess:nth-child(2n){border-radius:var(--r4)}
  .sess.done{opacity:.55} .sess.done>*{opacity:1}
  .sess.up{opacity:.65} .sess.up>*{opacity:1}
  .sess .ticks{flex-direction:column;align-items:stretch;margin-top:6px}
  .sess .tk{justify-content:flex-start}
}
/* a narrow day column drops "back" and "made" */
@container dgrp (max-width:170px){ .sess .lg{display:none} }
.seg{display:inline-flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:44px;padding:6px 14px;border:2px solid var(--btn-line);border-radius:var(--r3);background:transparent;color:var(--ink);font-weight:700;font-size:14.5px}
.seg button:nth-child(2n){border-radius:var(--r4)}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--board)}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=time],select,textarea{background:var(--field);border:2px solid var(--field-line);border-radius:var(--r4);padding:8px 11px;min-height:44px;min-width:0;width:100%;font-size:16px;color:var(--ink)}
/* 4.5.1: the open list of a dropdown is drawn by the browser on a solid colour. Give it the board's own sheet and ink,
   or Windows Chrome shows chalk-white text on a white list on the Night board. */
select option,select optgroup{background-color:var(--sheet);color:var(--ink)}
select option:disabled{color:var(--ink-2)}
input::placeholder,textarea::placeholder{color:var(--ink-2);opacity:.85}
textarea{min-height:110px;font-size:13px;line-height:1.4}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:700;color:var(--ink-2)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fgrid .full{grid-column:1/-1}
details>summary{cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}
.x{border:0;background:none;color:var(--ink-2);min-width:44px;min-height:44px;display:grid;place-items:center;padding:0;flex:none}
.x svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}

/* ---------- week strip, today circled in marker ---------- */
.striprow{display:flex;gap:2px;align-items:center;margin-top:12px}
.striprow .strip{flex:1;margin-top:0}
.navarrow{width:34px;height:60px;flex:none;border:0;background:none;display:grid;place-items:center;color:var(--ink-2);padding:0}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0;margin-top:12px}
.strip button{position:relative;min-height:60px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0;color:var(--ink)}
.strip button span{font-size:12px;color:var(--ink-2)}
.strip button b{font-size:17px;font-weight:700}
.strip button[aria-current="date"],.strip button[aria-current="date"] span{color:var(--study);font-weight:700}
.strip button.today:not([aria-current="date"]) b{text-decoration:underline 2px var(--study);text-underline-offset:3px}
/* a tall marker loop round the day and the date together (4.4) */
.circ{position:absolute;left:50%;top:50%;width:min(42px,calc(100% + 4px));height:58px;transform:translate(-50%,-50%);overflow:visible;fill:none;stroke:var(--study);stroke-width:2.2;stroke-linecap:round;pointer-events:none}

/* ---------- sticky notes held by magnets (Night board: chalk boxes) ---------- */
.notes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 14px;margin-top:18px}
@media (min-width:640px){.notes{grid-template-columns:repeat(4,minmax(0,1fr))}}
.sticky{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-height:92px;min-width:0;padding:16px 14px 12px;border:0;border-radius:2px 3px 2px 3px;background:var(--y);color:#1A1D23;text-align:left;box-shadow:var(--note-shadow);transform:rotate(var(--r,0deg))}
.sticky::before{content:"";position:absolute;top:-7px;left:50%;width:15px;height:15px;margin-left:-7px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--mag-hi),var(--mag) 68%);box-shadow:0 2px 3px rgba(0,0,0,.3)}
.sticky .lb{font-size:13px;font-weight:700}
.sticky .big{font-family:Kalam,cursive;font-weight:700;font-size:27px;line-height:1.15;max-width:100%}
.sticky .big.sm{font-size:22px;line-height:1.2}
.sticky .ft{font-size:13px;color:#3B414A}
.sticky .tally{color:#1A1D23}
.sticky:active{transform:rotate(var(--r,0deg)) scale(.97)}
.n-y{background:var(--y)} .n-b{background:var(--b)} .n-p{background:var(--p)} .n-g{background:var(--g)}
.m-red{--mag:#CC2F2A;--mag-hi:#F08B83} .m-blue{--mag:#1E4FC2;--mag-hi:#7D9CF0} .m-green{--mag:#1F7F45;--mag-hi:#6FC28E}
.notes .sticky:nth-child(1){--r:-1.4deg} .notes .sticky:nth-child(2){--r:1deg} .notes .sticky:nth-child(3){--r:-.7deg} .notes .sticky:nth-child(4){--r:1.3deg}
:root[data-board="night"] .sticky{--r:0deg;background:transparent;color:var(--ink);border:2px solid rgba(238,237,228,.45);border-radius:var(--r3);box-shadow:none}
:root[data-board="night"] .notes .sticky:nth-child(2n){border-radius:var(--r4)}
:root[data-board="night"] .sticky::before{display:none}
:root[data-board="night"] .sticky .lb{color:var(--nc,var(--hi))}
:root[data-board="night"] .sticky .ft{color:var(--ink-2)}
:root[data-board="night"] .sticky .tally{color:var(--ink)}

/* ---------- tallies and marker lines ---------- */
.tally{display:block;height:26px;width:auto;fill:none;stroke-linecap:round;color:var(--ink);overflow:visible}
.tally path{stroke:currentColor}
.tally .d{stroke:var(--tc,currentColor);stroke-width:2.8}
.tally .t{stroke-width:2;stroke-dasharray:2.5 4.5;opacity:.45}
.mline{display:flex;align-items:center;height:10px;min-width:40px}
.mline i{display:block;flex:none;height:4px;border-radius:2px;background:var(--c,var(--ink))}
.mline::after{content:"";flex:1;border-top:2px dashed var(--dash)}

/* ---------- the agenda, written straight on the board ---------- */
.agenda{list-style:none;margin:10px 0 0;padding:0}
.agenda ol{list-style:none;margin:0;padding:0}
.it{position:relative;display:flex;align-items:flex-start;gap:10px;padding:10px 4px;cursor:pointer}
.it .tm{position:relative;width:48px;flex:none;font-size:15px;line-height:22px;font-weight:700;font-variant-numeric:tabular-nums}
.nownote{display:block;width:max-content;font-family:Kalam,cursive;font-weight:700;font-size:18px;line-height:20px;color:var(--gym);transform:rotate(-7deg);transform-origin:left center}
:root[data-board="night"] .nownote{color:var(--hi)}
.chk,.mk{position:relative;flex:none;width:44px;height:44px;margin:-11px -8px -11px -10px;display:grid;place-items:center;color:var(--c,var(--ink-2))}
.chk{border:0;background:none;padding:0}
.chk svg,.mk svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.bx{stroke-width:2} .tkp{stroke-width:2.6} .dt{fill:currentColor;stroke:none}
.rg{stroke-width:2} .rg.on{fill:color-mix(in srgb,currentColor 28%,transparent)}
.it .tx{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.it .tt{font-size:17px;line-height:22px;font-weight:700}
.it .sb{font-size:14.5px;line-height:20px;color:var(--ink-2)}
.it .sb.bad{color:var(--bad);font-weight:700}
.it .sb.hint{color:var(--hint)}
.it.travel .tt{font-weight:400}
.stk{color:var(--c,var(--ink));background-image:linear-gradient(currentColor,currentColor);background-repeat:no-repeat;background-position:0 60%;background-size:0 2.5px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.stk>span{color:var(--ink)}
.it.done .stk{background-size:100% 2.5px}
.it.done{opacity:.55}
.it.cur::before{content:"";position:absolute;left:-8px;right:-2px;top:3px;bottom:3px;background:var(--hi);opacity:.8;mix-blend-mode:multiply;border-radius:6px 14px 8px 12px;transform:skewX(-4deg);transform-origin:left center;pointer-events:none}
:root[data-board="night"] .it.cur::before{background:rgba(243,227,141,.06);border:2px solid rgba(243,227,141,.85);border-radius:var(--r2);opacity:1;mix-blend-mode:normal;transform:none}
.freeln{display:flex;align-items:center;gap:10px;padding:3px 4px;font-size:13.5px;color:var(--ink-2)}
.freeln .tm{width:48px;flex:none;font-variant-numeric:tabular-nums}
.freeln .dash{width:24px;flex:none;border-top:2px dotted var(--dash)}
.liveln{display:flex;align-items:flex-start;gap:10px;padding:6px 4px;color:var(--ink-2);cursor:pointer}
.liveln .tm{width:48px;flex:none;font-weight:700;font-size:15px;line-height:20px;font-variant-numeric:tabular-nums}
.liveln .ring{flex:none;width:24px;height:20px;fill:none;stroke:var(--lse);stroke-width:2;stroke-dasharray:3.2 2.6}
.liveln .tx{flex:1;min-width:0;font-style:italic;font-size:14px;line-height:20px}
.fold{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;border:0;background:none;padding:8px 4px;color:var(--ink-2);font-size:14.5px;text-align:left}
.tick{width:20px;height:20px;flex:none;fill:none;stroke:var(--business);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
details[open]>.fold>svg:last-child{transform:rotate(180deg)}
.ticks{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tk{min-height:44px;padding:4px 12px;border:2px solid var(--c,var(--lse));border-radius:var(--r3);background:transparent;color:var(--c,var(--lse));font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:5px}
.tk:nth-child(2n){border-radius:var(--r4)}
:root[data-board="night"] .tk{color:var(--ink)}
.tk.on{background:var(--c,var(--lse));color:var(--on-mark)}
.tk svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.fab{position:fixed;right:18px;bottom:calc(90px + env(safe-area-inset-bottom));z-index:25;width:58px;height:58px;border-radius:50%;border:0;background:var(--ink);color:var(--board);display:grid;place-items:center;box-shadow:0 10px 18px -8px rgba(26,29,35,.55)}
.fab svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
body.L-C .fab{bottom:24px;right:24px}

/* ---------- layout A: one chalk-framed "now" box ---------- */
.focus{margin-top:18px;padding:20px 18px 18px;border:2px solid var(--frame);border-radius:var(--r1);background:var(--frame-bg);display:flex;flex-direction:column;gap:12px}
.focus .lbl{font-weight:700;font-size:14px;color:var(--gym)}
:root[data-board="night"] .focus .lbl{color:var(--hi)}
.focus .big{font-family:Kalam,cursive;font-weight:700;font-size:34px;line-height:1.12}
.focus p{margin:0;color:var(--ink-2);font-size:15px;line-height:21px}
.prog{display:flex;align-items:center;height:10px}
.prog i{display:block;flex:none;height:4px;border-radius:2px;background:var(--c,var(--ink))}
:root[data-board="night"] .prog i{background:var(--hi)}
.prog::after{content:"";flex:1;border-top:2px dashed var(--dash)}
.focus .acts{display:flex;gap:10px;flex-wrap:wrap}
.focus .acts .btn{min-height:50px;font-size:16px}
.focus .acts .btn.primary{flex:1}
.nextlist{margin-top:4px}
.counts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:20px}
.count{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0;padding:10px 10px 12px;border:2px solid var(--btn-line);border-radius:var(--r3);background:transparent;color:var(--ink);text-align:left}
.count:nth-child(2){border-radius:var(--r4)}
.count .lb{font-size:12.5px;font-weight:700;color:var(--nc,var(--ink))}
.count .big{font-family:Kalam,cursive;font-weight:700;font-size:20px;line-height:1.2;max-width:100%}
.count .ft{font-size:12.5px;color:var(--ink-2)}
.count .mline{width:100%;height:8px}
.count .tally{height:22px}
.count.cb{--nc:var(--bad)}
:root[data-board="night"] .count.cb{--nc:var(--hi);border-color:rgba(243,227,141,.7)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{min-height:44px;border:2px solid var(--btn-line);border-radius:var(--r3);background:transparent;padding:6px 12px;font-size:14px;font-weight:700;color:var(--ink);text-align:left}
.chip.warn{border-color:var(--warn);color:var(--warn)}

/* ---------- bars: a marker line with the rest dashed ---------- */
.bars{display:grid;grid-template-columns:minmax(84px,auto) minmax(0,1fr) auto;gap:12px;align-items:center;font-size:14.5px}
.bars .lb{font-weight:700}
.bars .track{display:flex;align-items:center;height:10px;min-width:0}
.bars .track i{display:block;flex:none;height:4px;border-radius:2px;background:var(--c,var(--ink))}
.bars .track::after{content:"";flex:1;border-top:2px dashed var(--dash)}
.bars .v{text-align:right;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.bars .tally{--tc:var(--gym)}

/* ---------- lists ---------- */
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1.5px solid var(--rule-soft)}
.card h2+.li,.li.first{border-top:0}
.li .tx{flex:1;min-width:0}
.li .t{font-weight:700;font-size:15.5px;line-height:21px}
.li .s{font-size:14px;line-height:19px;color:var(--ink-2)}
.li .s.bad{color:var(--bad);font-weight:700}
.li .s.hint{color:var(--hint)}
.li .chk{margin:-8px -4px -8px -10px}
.code{font-size:12.5px;font-weight:700;color:var(--ink-2);width:56px;flex:none}
.empty{color:var(--ink-2);margin:8px 0}
.more .li:first-child{border-top:0}
.more .li{width:100%;border-left:0;border-right:0;border-bottom:0;background:none;text-align:left;color:var(--ink);min-height:60px}

/* ---------- week grid ---------- */
.wk{display:grid;grid-template-columns:48px repeat(7,minmax(0,1fr));margin-top:16px;border-top:1.5px solid var(--rule)}
.wk .dh{padding:8px 4px;border-bottom:1.5px solid var(--rule);font-size:14px;font-weight:700;text-align:center}
.wk .dh small{display:block;color:var(--ink-2);font-weight:400;font-size:12.5px}
.wk .dh.today{color:var(--study)}
.wk .gut{position:relative}
.wk .gut span{position:absolute;right:6px;font-size:11.5px;color:var(--ink-2);transform:translateY(-7px)}
.wk .col{position:relative;border-left:1.5px solid var(--rule-soft);background-image:linear-gradient(var(--rule-soft) 1px,transparent 1px);background-size:100% 48px}
.wk .col.today{background-color:color-mix(in srgb,var(--hi) 10%,transparent)}
.blk{position:absolute;left:3px;right:3px;border:2px solid var(--c);border-radius:7px 9px 6px 8px;background:color-mix(in srgb,var(--c) 12%,var(--board));color:var(--ink);font-size:11.5px;line-height:1.25;padding:1px 5px;overflow:hidden;cursor:pointer}
.blk.c-free{background:transparent;border-style:dotted;border-color:var(--rule);color:var(--ink-2)}
.blk b{font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .t{color:var(--ink-2);font-size:10.5px}
.blk.done{opacity:.5}
.blk.missed{border-style:dashed;border-color:var(--bad)}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--gym);z-index:3}
.wklist{display:none}
body:not(.L-C) .wk{display:none} body:not(.L-C) .wklist{display:block}
@media (max-width:900px){body.L-C .wk{display:none}body.L-C .wklist{display:block}}
.wklist h3{margin:26px 0 0;font-family:Kalam,cursive;font-weight:700;font-size:28px;line-height:32px}
.wklist h3 small{font-family:"Atkinson Hyperlegible",sans-serif;font-weight:400;font-size:14px;color:var(--ink-2);margin-left:8px}

/* ---------- gym ---------- */
.gname{font-weight:700;font-size:20px;line-height:26px;margin-top:2px}
.gdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;margin-top:12px}
.gdays button{position:relative;height:50px;border:0;background:none;padding:0;color:var(--ink);font-family:Kalam,cursive;font-weight:700;font-size:22px;display:grid;place-items:center}
.gdays .c{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}
.gdays button span{position:relative}
.gdays button.done{color:var(--ink-2)}
.gdays button.d7 .c{stroke-dasharray:3 4}
.gdays button[aria-pressed="true"]{color:var(--gym)}
.gdays button[aria-pressed="true"] .c{stroke-width:3}
.gdays .ok{position:absolute;right:2px;top:0;width:16px;height:16px;fill:none;stroke:var(--business);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.gline{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:14px;color:var(--ink-2)}
.gline .tally{--tc:var(--gym);height:24px}
.ex{display:flex;flex-direction:column;gap:10px;padding:2px 0 18px;border-bottom:1.5px solid var(--rule-soft)}
.ex+.ex{margin-top:16px}
.ex.cur{padding:16px 16px 18px;border:2px solid var(--frame);border-radius:var(--r1);background:var(--frame-bg)}
.ex .hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ex .nm{font-size:19px;line-height:24px;font-weight:700}
.ex.cur .nm{font-size:22px;line-height:27px}
.ex .rx{font-size:13.5px;color:var(--ink-2);text-align:right}
.ex .last{font-size:14.5px;line-height:20px;color:var(--ink-2)}
.ex .up{font-size:14.5px;line-height:20px;color:var(--good);font-weight:700}
.ex .tk{align-self:flex-start}
.setrow{display:grid;grid-template-columns:52px minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center}
.setrow span{font-size:14px;color:var(--ink-2)}
.setrow input{height:46px;text-align:center;font-size:17px;font-weight:700;border-color:var(--btn-line)}
.setrow input:nth-child(3){border-radius:var(--r3)}

/* ---------- food ---------- */
.fhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.fhead .dnav{display:flex;align-items:center;gap:6px}
.fhead .dlbl{font-weight:700;font-size:16px;min-width:80px;text-align:center}
.crbtn{min-height:44px;padding:0 12px 0 8px;border:2px solid var(--business);border-radius:var(--r2);background:transparent;color:var(--ink);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.crbtn svg{width:24px;height:24px;fill:none;stroke:var(--business);stroke-linecap:round;stroke-linejoin:round}
.ptop{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-top:8px}
.pbig{font-family:Kalam,cursive;font-weight:700;font-size:72px;line-height:76px}
.ptop .muted{font-size:15px;line-height:20px}
.pbar{position:relative;height:30px;margin:6px 0 4px}
.pbar .ol{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;overflow:visible}
.pbar i{position:absolute;left:3px;top:5px;bottom:5px;background:var(--business);opacity:.82;border-radius:3px 8px 4px 6px}
.pbar .zone{position:absolute;top:2px;bottom:2px;background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--business) 55%,transparent) 0 2px,transparent 2px 7px);border-left:2px solid var(--business);border-right:2px solid var(--business)}
.pbar.sm{height:16px}
.pbar.sm i{top:3px;bottom:3px}
:root[data-board="night"] .pbar{height:14px}
:root[data-board="night"] .pbar .ol{display:none}
:root[data-board="night"] .pbar::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px dashed var(--dash)}
:root[data-board="night"] .pbar i{left:0;top:calc(50% - 2.5px);bottom:auto;height:5px;opacity:1;border-radius:3px}
:root[data-board="night"] .pbar .zone{top:0;bottom:0;border:0}
.pscale{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-2)}
.pmac{font-size:14.5px;color:var(--ink-2);margin-top:6px}
.pst{margin:10px 0 0;font-size:15px;line-height:21px}
.pst.hint{color:var(--hint);font-weight:700}
.pst.good{color:var(--good);font-weight:700}
.qadd{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:600px){.qadd{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
.qadd button{min-height:64px;padding:10px 12px;border:0;border-radius:2px 3px 2px 3px;background:var(--y);color:#1A1D23;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:2px;line-height:1.2;box-shadow:0 9px 12px -9px rgba(26,29,35,.45);transform:rotate(var(--r,0deg))}
.qadd button:nth-child(4n+1){background:var(--y);--r:-1.2deg} .qadd button:nth-child(4n+2){background:var(--b);--r:.9deg}
.qadd button:nth-child(4n+3){background:var(--p);--r:.6deg} .qadd button:nth-child(4n+4){background:var(--g);--r:-.8deg}
.qadd button:active{transform:rotate(var(--r,0deg)) scale(.97)}
.qadd button b{font-size:15px}
.qadd button span{font-family:Kalam,cursive;font-weight:700;font-size:18px;line-height:20px}
:root[data-board="night"] .qadd button{--r:0deg;background:transparent;color:var(--ink);border:2px solid rgba(238,237,228,.4);border-radius:var(--r3);box-shadow:none}
:root[data-board="night"] .qadd button:nth-child(2n){border-radius:var(--r4)}
.fsub{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:16px 0 2px;font-size:14px;color:var(--ink-2)}
.fsub b{color:var(--ink);font-size:15px}
.fe{display:grid;grid-template-columns:22px minmax(0,1fr) auto;grid-template-areas:"tk tx x" ". stp stp";gap:2px 10px;align-items:center;padding:6px 0}
.fe .tick{grid-area:tk;stroke:var(--meal)}
.fe.drink .tick{stroke:var(--study)}
.fe .tx{grid-area:tx;min-width:0}
.fe .x{grid-area:x}
.fe .stp{grid-area:stp}
@media (min-width:600px){.fe{grid-template-columns:22px minmax(0,1fr) auto auto;grid-template-areas:"tk tx stp x"}}
.fe .t{font-weight:700;font-size:16px;line-height:21px}
.fe .s{font-size:13.5px;line-height:18px;color:var(--ink-2)}
.stp{display:flex;align-items:center;gap:4px}
.stp button{width:44px;height:44px;border:2px solid var(--btn-line);border-radius:var(--r3);background:transparent;font-size:20px;font-weight:700;padding:0;display:grid;place-items:center}
.stp button:last-of-type{border-radius:var(--r4)}
.stp input{width:64px;min-height:44px;padding:4px;text-align:center}
.ftotal{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:10px;padding-top:10px;border-top:2px solid var(--ink);font-weight:700;font-size:15px}
.ftotal .v{padding-bottom:2px;border-bottom:4px double var(--ink);font-variant-numeric:tabular-nums;text-align:right}
.segr{position:relative;display:inline-flex}
.segr input{position:absolute;opacity:0;width:1px;height:1px}
.segr span{min-height:44px;padding:8px 16px;border:2px solid var(--btn-line);border-radius:var(--r3);font-weight:700;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;width:100%}
.segr:nth-child(2n) span{border-radius:var(--r4)}
.segr input:checked+span{background:var(--ink);border-color:var(--ink);color:var(--board)}
.segr input:focus-visible+span{outline:2px solid var(--ink);outline-offset:2px}
.dlg .segr{width:100%}
.foodmini{border-color:var(--business)}
:root[data-board="night"] .foodmini{border-color:rgba(166,219,152,.6)}
.foodmini h2{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:17px;margin:0 0 4px}
.foodmini h2 .r{font-size:13.5px;font-weight:400;color:var(--ink-2)}
.pbig.sm{font-size:40px;line-height:44px}
.water{display:grid;gap:10px}
.glasses{display:flex;gap:3px;flex-wrap:wrap;align-items:flex-end}
.glasses svg{width:22px;height:28px;fill:none;stroke:var(--study);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.glasses svg.e .gl{stroke-dasharray:3 3;opacity:.5}
.glasses .wf{fill:var(--study);stroke:none;opacity:.35}
.wbtns{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.wnote{font-size:14px;color:var(--ink-2)}
.wnote b{color:var(--ink)}
.wchips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.wchip{display:inline-flex;align-items:center;padding-left:11px;border:1.5px solid var(--rule);border-radius:var(--r3);font-size:14px;color:var(--ink);background:var(--cell)}
.wchip .x{min-width:40px;min-height:40px}
.wchip .x svg{width:13px;height:13px}
/* 4.5: fruit and veg tally, vitamin D tick, hidden limits, food spend */
.fhbtns{display:flex;gap:8px;flex-wrap:wrap}
.fv{display:grid;gap:10px}
.fvline{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.fvline .tally{--tc:var(--business);height:30px}
.lim{margin:8px 0 0;font-size:14.5px;line-height:20px;color:var(--warn);font-weight:700}
/* 4.5.2: alarms. A marker frame you would draw round a mistake on a board: orange for too much, red for can't be right */
.alarm{margin:12px 0 0;padding:10px 12px;border:2px solid var(--warn);border-radius:var(--r3);font-size:15px;line-height:21px;color:var(--ink)}
.alarm b{color:var(--warn)}
.alarm.bad{border-color:var(--bad)} .alarm.bad b{color:var(--bad)}
.pst.warn{color:var(--warn);font-weight:700} .pst.bad{color:var(--bad);font-weight:700}
.wnote.over{color:var(--warn);font-weight:700}
.sline{display:flex;align-items:center;height:12px;margin-top:10px;min-width:0}
.sline i{display:block;flex:none;height:5px;border-radius:2px 4px 3px 2px;background:var(--meal)}
.sline::after{content:"";flex:1;border-top:2px dashed var(--dash)}
.sline.over i{background:var(--warn)}
.wrows{display:flex;flex-direction:column}
.wrow{display:grid;grid-template-columns:64px minmax(0,1fr) 112px;gap:10px;align-items:center;min-height:44px;border:0;background:none;padding:4px 0;text-align:left;font-size:14px;color:var(--ink)}
.wrow:hover{background:var(--wash)}
.wrow .lb{font-weight:700}
.wrow .v{text-align:right;color:var(--ink-2);white-space:nowrap}
.wrow .track{display:block;height:0;border-top:2px dashed var(--dash)}
.wrow .pbar{margin:0}
.urow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 0;border-top:1.5px solid var(--rule-soft)}
.urow select[data-usm]{flex:0 0 118px;width:auto}
.urow select[data-usf]{flex:1 1 170px;width:auto}
.urow input{flex:0 0 76px;width:76px}
.foods .li .t .tag{font-weight:700}
.shop{list-style:none;margin:0;padding:0}
.shop li{display:flex;align-items:center;gap:10px;padding:4px 0;border-top:1.5px solid var(--rule-soft)}
.shop li:first-child{border-top:0}
.shop input[type=checkbox]{width:22px;height:22px;accent-color:var(--business);flex:none;margin:11px}
.shop li.got span{text-decoration:line-through;text-decoration-color:var(--meal);text-decoration-thickness:2px;opacity:.6}
.shop .x{margin-left:auto}
.prose p{margin:0 0 10px}.prose ul{margin:0 0 10px;padding-left:20px}.prose li{margin:4px 0}
.spark{width:100%;height:90px;display:block;margin-top:8px}

/* ---------- setup ---------- */
.sw{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0;border-top:1.5px solid var(--rule-soft)}
.card h2+.sw{border-top:0}
.sw small{display:block;color:var(--ink-2);font-size:13.5px}
.tog{position:relative;width:54px;height:32px;border-radius:16px;border:2px solid var(--btn-line);background:transparent;flex:none;padding:0}
.tog::before{content:"";position:absolute;inset:-8px -4px}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--ink-2);transition:left .15s}
.tog[aria-checked="true"]{background:var(--business);border-color:var(--business)}
.tog[aria-checked="true"]::after{left:25px;background:var(--on-mark)}
.cat{min-height:44px;border:2px solid var(--c);border-radius:var(--r3);background:transparent;padding:6px 12px;font-size:14px;font-weight:700;color:var(--ink-2)}
.cat[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--ink)}
.lay{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.lay button{border:2px solid var(--btn-line);background:transparent;border-radius:var(--r1);padding:12px;text-align:left;display:flex;flex-direction:column;gap:3px;min-height:92px;color:var(--ink)}
.lay button:nth-child(2){border-radius:var(--r2)}
.lay button b{font-size:16px}
.lay button span{font-size:13px;color:var(--ink-2)}
.lay button[aria-pressed="true"]{border:3px solid var(--ink);background:var(--frame-bg)}
@media (max-width:520px){.lay{grid-template-columns:1fr}}

/* ---------- progress ---------- */
.mhead{display:flex;align-items:center;gap:8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:20px 18px;margin-top:16px}
.kpi{padding-top:8px;border-top:2px solid var(--ink);min-width:0}
.kpi span{display:block;font-size:13.5px;font-weight:700;color:var(--ink-2)}
.kpi b{display:block;font-family:Kalam,cursive;font-weight:700;font-size:34px;line-height:38px;margin-top:2px}
.kpi small{display:block;font-size:13px;color:var(--ink-2)}
.kpi .tally{--tc:var(--gym);height:22px;margin:2px 0}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-size:12.5px;font-weight:700;color:var(--ink-2);text-align:center;padding-bottom:2px}
.cell{position:relative;min-height:66px;border-radius:8px 10px 7px 9px;background:var(--cell);padding:5px 4px 9px;display:flex;flex-direction:column;gap:3px;overflow:hidden;border:1.5px solid var(--rule-soft);text-align:left;color:var(--ink)}
.cell.blank{background:transparent;border-color:transparent}
.cell.today{border:2px solid var(--study)}
.cell.future{opacity:.5}
.cell .n{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.gchip{display:inline-block;align-self:flex-start;font-size:11.5px;font-weight:700;padding:1px 6px;border-radius:6px 8px 5px 7px;background:var(--gym);color:var(--on-mark);line-height:1.35}
.gchip.d7{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--gym)}
.gchip.home{background:transparent;color:var(--teal-text);box-shadow:inset 0 0 0 1.5px var(--academy)}
.cell .sc{position:absolute;left:5px;right:5px;bottom:4px;height:3px;border-radius:2px;background:var(--rule)}
.cell .sc i{display:block;height:100%;border-radius:2px;background:var(--business)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:12px;font-size:13px;color:var(--ink-2);align-items:center}
.legend .lg{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.split div{border:1.5px solid var(--rule);border-radius:var(--r3);padding:8px 12px}
.split b{font-family:Kalam,cursive;font-weight:700;font-size:22px;color:var(--gym)}
.split span{display:block;font-size:13px;color:var(--ink-2)}
@media (max-width:520px){.kpi:last-child:nth-child(odd){grid-column:1/-1}}
@media (max-width:420px){.cell{min-height:56px;padding:4px 3px 8px}.gchip{font-size:10.5px;padding:0 4px}.kpi b{font-size:30px}}

/* ---------- gym picker ---------- */
.pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.pick button{border:2px solid var(--btn-line);background:transparent;border-radius:var(--r3);padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:1px;min-height:64px;color:var(--ink)}
.pick button:nth-child(2n){border-radius:var(--r4)}
.pick button b{font-size:15.5px}
.pick button span{font-size:13px;color:var(--ink-2)}
.pick button em{font-style:normal;font-family:Kalam,cursive;font-weight:700;font-size:16px;color:var(--gym)}
.pick button.sugg{border:3px solid var(--gym)}
.pick button:last-child{grid-column:1/-1}

/* ---------- overlays ---------- */
.banner,.update{position:fixed;left:16px;right:16px;margin:0 auto;width:max-content;transform:rotate(-.5deg);top:calc(12px + env(safe-area-inset-top));z-index:50;background:var(--y);color:#1A1D23;border-radius:2px 3px 2px 3px;box-shadow:0 12px 18px -10px rgba(26,29,35,.5);max-width:min(560px,calc(100% - 32px))}
.banner{padding:12px 18px;cursor:pointer}
.banner b{display:block;font-size:16px}
.update{z-index:70;padding:8px 8px 8px 16px;display:flex;gap:12px;align-items:center;white-space:nowrap}
.update .btn.primary{background:#1A1D23;border-color:#1A1D23;color:#FFE97A}
:root[data-board="night"] .banner,:root[data-board="night"] .update{background:var(--sheet);color:var(--ink);border:2px solid var(--frame);border-radius:var(--r2);transform:none;box-shadow:0 10px 30px rgba(0,0,0,.4)}
:root[data-board="night"] .update .btn.primary{background:var(--ink);border-color:var(--ink);color:var(--board)}
.night{position:fixed;inset:0;z-index:100;color:#EEEDE4;display:grid;place-items:center;padding:24px;
  background:radial-gradient(60% 40% at 18% 12%,rgba(238,237,228,.06),rgba(238,237,228,0) 70%),linear-gradient(100deg,rgba(238,237,228,0) 18%,rgba(238,237,228,.045) 28%,rgba(238,237,228,0) 44%),#1D2925}
.night .box{max-width:460px;text-align:center}
.night .clockbig{font-family:Kalam,cursive;font-weight:700;font-size:72px;line-height:1}
.night h2{font-size:26px;margin:12px 0 10px}
.night p{color:#B8C3BD;margin:0 0 22px}
.night .btn{background:transparent;color:#EEEDE4;border-color:rgba(238,237,228,.55)}
.night .btn.primary{background:#EEEDE4;color:#1D2925;border-color:#EEEDE4}
dialog{border:0;border-radius:16px 20px 15px 19px / 18px 15px 20px 16px;background:var(--sheet);color:var(--ink);padding:0;max-width:min(520px,calc(100% - 24px));width:100%;max-height:none;overflow:visible;box-shadow:0 24px 50px -20px rgba(0,0,0,.5)}
dialog::before,dialog::after{content:"";position:absolute;top:-7px;width:15px;height:15px;border-radius:50%;z-index:1;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c,#263C78) 50%,#fff),var(--c,#263C78) 68%);box-shadow:0 2px 3px rgba(0,0,0,.3)}
dialog::before{left:20px} dialog::after{right:20px}
dialog[open]{animation:dlgin .22s cubic-bezier(.2,.8,.3,1)}
dialog::backdrop{background:rgba(16,20,24,.45)}
.dlg{padding:24px 20px 20px;max-height:calc(100vh - 48px);max-height:calc(100dvh - 48px);overflow-y:auto}
.dlg:focus{outline:none}
.dlg h3{font-size:22px;margin:2px 0 4px;line-height:1.2}
.dlg p{margin:10px 0}
.dlg .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.dlg hr{border:0;border-top:1.5px solid var(--rule);margin:16px 0}
.dlg .seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));width:100%}
.dlg .seg.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.toast{position:fixed;bottom:calc(96px + env(safe-area-inset-bottom));left:16px;right:16px;margin:0 auto;width:max-content;transform:rotate(-.4deg);z-index:60;background:var(--y);color:#1A1D23;padding:6px 6px 6px 16px;border-radius:2px 3px 2px 3px;font-size:15px;display:flex;align-items:center;gap:12px;max-width:min(560px,calc(100% - 32px));box-shadow:0 10px 16px -10px rgba(26,29,35,.55)}
.toast:not(.has-undo){padding:12px 16px}
.toast button{min-height:44px;padding:0 12px;border:2px solid #1A1D23;border-radius:var(--r3);background:transparent;color:#1A1D23;font-weight:700}
:root[data-board="night"] .toast{background:var(--sheet);color:var(--ink);border:2px solid var(--frame);border-radius:var(--r2);transform:none;box-shadow:0 10px 30px rgba(0,0,0,.4)}
:root[data-board="night"] .toast button{color:var(--ink);border-color:var(--btn-line)}
body.L-C .toast{bottom:24px}
.restbar{position:fixed;left:14px;right:14px;max-width:560px;margin:0 auto;bottom:calc(90px + env(safe-area-inset-bottom));z-index:55;background:var(--gym);color:var(--on-mark);border-radius:var(--r2);padding:8px 8px 8px 18px;display:flex;gap:10px;align-items:center;box-shadow:0 12px 20px -10px rgba(26,29,35,.5)}
.restbar #restTxt{flex:1;font-family:Kalam,cursive;font-weight:700;font-size:26px;line-height:30px}
.restbar button{min-height:44px;padding:0 12px;border:2px solid currentColor;border-radius:var(--r3);background:transparent;color:inherit;font-weight:700;font-size:14px}
body.L-C .restbar{bottom:24px}

/* ---------- motion: one write-in when a screen opens; nothing loops ---------- */
@keyframes write{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
@keyframes stick{from{opacity:0;transform:translateY(-10px) rotate(var(--r,0deg)) scale(1.04)}to{opacity:1;transform:rotate(var(--r,0deg))}}
@keyframes swipe{from{transform:skewX(-4deg) scaleX(0)}to{transform:skewX(-4deg) scaleX(1)}}
@keyframes chalkin{from{opacity:0;filter:blur(2px)}}
@keyframes draw{from{stroke-dashoffset:30}to{stroke-dashoffset:0}}
@keyframes strike{from{background-size:0 2.5px}to{background-size:100% 2.5px}}
@keyframes grow{from{width:var(--from,0%)}}
@keyframes dlgin{from{opacity:0;transform:translateY(12px)}}
#view.anim{animation:rise .18s ease-out}
#view.anim .topbar h1{animation:write .42s cubic-bezier(.25,.8,.25,1) .1s backwards}
#view.anim .topbar .sub{animation:write .42s cubic-bezier(.25,.8,.25,1) .155s backwards}
#view.anim .agenda>li{animation:write .42s cubic-bezier(.25,.8,.25,1) backwards;animation-delay:calc(380ms + var(--i,0) * 55ms)}
#view.anim .sticky{animation:stick .5s cubic-bezier(.2,.9,.3,1.25) backwards;animation-delay:calc(650ms + var(--i,0) * 70ms)}
#view.anim .it.cur::before{animation:swipe .5s cubic-bezier(.3,.8,.3,1) .9s backwards}
:root[data-board="night"] #view.anim .it.cur::before{animation:chalkin .6s ease-out .9s backwards}
#view.anim .focus,#view.anim .ex.cur{animation:chalkin .6s ease-out .22s backwards}
.it.fresh .tkp{stroke-dasharray:30;animation:draw .26s ease-out backwards}
.it.fresh.done .stk{animation:strike .2s ease-out .26s backwards}
.fe.fresh{animation:write .4s cubic-bezier(.25,.8,.25,1) backwards}
.pbar i.grow{animation:grow .4s cubic-bezier(.3,.8,.3,1)}
.chk.fresh .tkp,.crbtn.fresh .tkp{stroke-dasharray:30;animation:draw .26s ease-out backwards}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <nav class="sidenav" id="side" hidden aria-label="Sections"></nav>
  <main class="wrap" id="view"></main>
</div>
<nav class="bottomnav" id="bottom" hidden aria-label="Sections"></nav>
<button class="fab" id="fab" hidden aria-label="Add a block, lecture, deadline or food"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.3 4.5c-.4 5-.2 10 .1 15M4.6 12.2c5-.3 10-.2 14.9.2"/></svg></button>
<div class="banner" id="banner" hidden></div>
<div class="restbar" id="restBar" hidden><span id="restTxt"></span><button id="restAdd">+30 s</button><button id="restStop">Stop</button></div>
<div class="night" id="night" hidden>
  <div class="box">
    <div class="clockbig" id="nightClock"></div>
    <h2 id="nightHead"></h2>
    <p id="nightText"></p>
    <div class="row-flex" style="justify-content:center">
      <button class="btn primary" id="nightGo"></button>
      <button class="btn" id="nightSnooze"></button>
    </div>
  </div>
</div>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" hidden><span id="toastTxt"></span><button id="toastUndo" hidden>Undo</button></div>
<div class="update" id="updateBar" hidden><span>A new version is ready.</span><button class="btn small primary" id="updateGo">Update</button></div>
<button id="installBtn" hidden></button>

<script>
(function(){
'use strict';

/* ================= time helpers ================= */
const params = new URLSearchParams(location.search);
let OFFSET = 0;
if (params.get('now')) { const t = new Date(params.get('now')); if (!isNaN(t)) OFFSET = t.getTime() - Date.now(); }
const now = () => new Date(Date.now() + OFFSET);
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const dOf = s => { const a = s.split('-').map(Number); return new Date(a[0], a[1] - 1, a[2]); };
const addD = (s, n) => { const d = dOf(s); d.setDate(d.getDate() + n); return iso(d); };
const dow = s => dOf(s).getDay();
const hm = s => { const a = s.split(':').map(Number); return a[0] * 60 + a[1]; };
const tm = m => pad(Math.floor(m / 60)) + ':' + pad(m % 60);
const at = (s, m) => { const a = s.split('-').map(Number); return new Date(a[0], a[1] - 1, a[2], Math.floor(m / 60), m % 60); };
const today = () => iso(now());
const nowM = () => { const n = now(); return n.getHours() * 60 + n.getMinutes(); };
const daysBetween = (a, b) => Math.round((dOf(b) - dOf(a)) / 864e5);
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const dayName = (s, short) => { const n = DAYS[dow(s)]; return short ? n.slice(0, 3) : n; };
const niceDate = (s, short) => { const d = dOf(s); return (short ? DAYS[d.getDay()].slice(0, 3) + ' ' : '') + d.getDate() + ' ' + (short ? MONTHS[d.getMonth()].slice(0, 3) : MONTHS[d.getMonth()]); };
const weekStart = s => { const w = dow(s); return addD(s, w === 0 ? -6 : 1 - w); };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hrs = x => (Math.round(x * 4) / 4) + 'h';
const o = (...a) => Object.assign({}, ...a);

/* ================= storage ================= */
const KEY = 'hlp1_state', DKEY = 'hlp1_device';
const APP_VERSION = '4.6';
const APP_URL = 'hemsaivp.github.io/life-planner';
const V3_START = '2026-10-12';   // career blocks and new features start here; earlier days stay as they were
const defAlerts = () => ({banner:true, system:false, sound:false, vibrate:false, leave:true, bedtime:'lock',
  cats:{lse:true, study:true, academy:true, gym:true, business:true, career:true, meal:true, chores:true, admin:true}});
const defPrefs = () => ({recDelay:60, budget:35, careerMin:60, careerBreakMin:120, gymMin:4, gymMax:5, homeMin:2, homeMax:3,
  proteinLo:120, proteinHi:130, startKg:58, goalKg:65, waterL:2, glassMl:250, bottleMl:500,
  fatPct:35, sugarG:30, fvGoal:5, vitD:1});
// Food values per base amount. Conservative label-style estimates for plain food: log butter or oil separately.
// Edit any of them in Food & body › Your foods (use your own labels).
// s = free sugar g (added sugar and juice; not the sugar in whole fruit or milk). fv = fruit and veg portions (80 g = 1).
// fvk = counts once a day however much you have (NHS: beans and pulses, juice). vg = what it adds: C vitamin C, G greens, A orange veg.
const FOODS = {
  bagel:  {n:'Bagels', per:1, u:'bagel', us:'bagels', cnt:1, def:2, st:1, p:10, c:45, f:1.5, k:235, s:3},
  bot:    {n:'Beans on toast', per:1, u:'serving (½ tin, 2 slices)', us:'servings', def:1, st:0.5, p:16, c:57, f:2.5, k:350, s:6, fv:1, fvk:'beans'},
  thighR: {n:'Chicken thighs (raw weight)', per:100, u:'g', def:200, st:50, p:17, c:0, f:8, k:140},
  thighC: {n:'Chicken thighs (cooked weight)', per:100, u:'g', def:150, st:50, p:24, c:0, f:9, k:177},
  breastR:{n:'Chicken breast (raw weight)', per:100, u:'g', def:200, st:50, p:22, c:0, f:2, k:106},
  breastC:{n:'Chicken breast (cooked weight)', per:100, u:'g', def:150, st:50, p:30, c:0, f:3.5, k:152},

  {id:'XMAS',   name:'Christmas break',              from:'2026-12-12', to:'2027-01-03', tpl:'BREAK', v:'xmas', lc:'Christmas break'},

  {id:'SUMMER', name:'Summer',                       from:'2027-06-12', to:'2027-09-26', tpl:'SUMMER', lc:'summer'}
];
const OUTSIDE = {id:'OUT', name:'Outside the plan', tpl:'SUMMER', lc:'outside the plan'};
const HOLIDAYS = {'2026-12-24':'Christmas Eve','2026-12-25':'Christmas Day','2026-12-26':'Boxing Day','2026-12-31':"New Year's Eve",'2027-01-01':"New Year's Day"};
const periodOf = d => PERIODS.find(p => d >= p.from && d <= p.to) || OUTSIDE;
function periodLabel(d){
  const p = periodOf(d); let s = p.name;
  if (p.wk){ const w = Math.floor(daysBetween(p.wk, d) / 7) + 1; s += ' · week ' + w; if (p.reading === w) s += ' (reading week)'; }
  if (HOLIDAYS[d]) s += ' · ' + HOLIDAYS[d];
  return s;
}
// The same, written as a sentence for the screen: "week 3 of autumn term".
function periodSentence(d){
  const p = periodOf(d); let s = p.lc || p.name;
  if (p.wk){ const w = Math.floor(daysBetween(p.wk, d) / 7) + 1; s = 'week ' + w + ' of ' + s + (p.reading === w ? ', reading week' : ''); }
  return s + (HOLIDAYS[d] ? '. ' + HOLIDAYS[d] : '');
}

/* ================= build a day ================= */
const overlap = (a, b) => a.s < b.e && b.s < a.e;
const cache = new Map();
const CONFLICTS = [];
/* Lectures you watch at home: Echo360 only has the recording a while after the lecture ends,
   so each one is planned into study time after that (never at the live time). The live time
   shows as a reminder line, and the plain study block under it stays as study. */
const isHomeLecture = x => x.kind === 'lecture' && !(SESS[x.date] || []).some(y => y.kind === 'class' || y.kind === 'workshop');
const recDelay = () => (S.prefs.recDelay >= 0 ? +S.prefs.recDelay : 60);
function baseDay(d){
  const ck = 'B|' + d; if (cache.has(ck)) return cache.get(ck);
  const p = periodOf(d), w = dow(d), ss = sessionsOn(d);
  const campus = ss.some(x => x.kind === 'class' || x.kind === 'workshop');
  const ctx = {campus, p, d};
  const out = [], busy = [], deferred = [];
  for (const x of ss){
    if (x.kind === 'help') continue;
    if (x.kind === 'lecture' && !campus){ deferred.push(x); continue; }
    const inPerson = campus && x.kind !== 'qa';
    let t = x.label, n = 'In person.';
    if (x.kind === 'lecture'){ t += ', in person'; n = N.inperson; }
    if (x.kind === 'qa') n = N.qa;
    const b = {s:x.s, e:x.e, cat:'lse', t, n, id:x.id, sess:x, opt:x.kind === 'qa', plan: inPerson ? 'attend' : 'watch'};
    out.push(b); busy.push(b);
  }
  let leave = null;
  if (campus){
    const ip = ss.filter(x => x.kind === 'lecture' || x.kind === 'class' || x.kind === 'workshop');
    const first = Math.min(...ip.map(x => x.s)), last = Math.max(...ip.map(x => x.e));
    const t1 = {s:first - 45, e:first - 5, cat:'travel', t:'Cycle to campus', n:N.travel};
    const t2 = {s:last, e:last + 40, cat:'travel', t:'Cycle home', n:N.travel};
    leave = t1.s; out.push(t1, t2); busy.push(t1, t2);
  }
  let tpl;
  if (HOLIDAYS[d]) tpl = T.HOLIDAY(d);
  else if (w === 6) tpl = T.SAT(d, ctx, p);
  else if (w === 0) tpl = T.SUN(d, ctx, p);
  else tpl = T[p.tpl](d, ctx, p, w);
  tpl = [WAKE(), ...tpl, WIND()].filter(b => !(b.campusOnly && !campus) && !(b.homeOnly && campus))
    .map(b => (typeof b.t === 'function' ? o(b, {t:b.t(d, ctx)}) : b));
  for (const b of tpl.filter(b => !b.flex && !b.move)){
    if (busy.some(x => overlap(b, x))) CONFLICTS.push(d + ' fixed ' + tm(b.s) + ' ' + b.t);
    out.push(b); busy.push(b);
  }
  for (const b0 of tpl.filter(b => b.move)){
    const b = o(b0), len = b.e - b.s; let g = 0, hit;
    while ((hit = busy.find(x => overlap(b, x))) && g++ < 8){ b.s = hit.e; b.e = hit.e + len; b.moved = true; }
    if (busy.some(x => overlap(b, x)) || b.e > 22 * 60 + 30) CONFLICTS.push(d + ' move ' + tm(b0.s) + ' ' + b.t);
    out.push(b); busy.push(b);

  if (!(need > 0)) return;
  const take = (b, len, fromEnd) => {

function catchPlan(){
  const beh = behindLectures(), res = {byLec:{}, byBlock:{}};
  if (!beh.length) return res;
  const t = today(), m = nowM(), slots = [];
  for (let i = 0; i < 10; i++){
    const d = addD(t, i);
    for (const b of dayBlocks(d)) if ((b.cat === 'study' || b.cat === 'academy') && (i > 0 || b.s >= m - 10) && !S.done[b.id] && b.e - b.s >= 45){
      // plain study and catch-up blocks first, then study blocks not tied to a deadline, then academy time
      const rank = b.cat === 'academy' ? 3 : (b.t === 'Study' || /^Catch-up/.test(b.t)) ? 1 : /due|submit|finish|Revision|help-lecture/i.test(b.t) ? 9 : 2;
      if (rank < 9) slots.push({d, b, left:b.e - b.s, rank});
    }
  }
  for (const x of beh){
    const need = x.e - x.s, fit = s => s.left >= Math.min(need, 60);
    const sl = slots.find(s => s.rank === 1 && fit(s)) || slots.find(s => s.rank === 2 && fit(s)) || slots.find(s => s.rank === 3 && fit(s));
    if (!sl) continue;
    sl.left -= need; res.byLec[x.id] = sl;

}

function weekStats(ws){
  const r = {study:{d:0,p:0}, academy:{d:0,p:0}, business:{d:0,p:0}, career:{d:0,p:0}, bed:{d:0,p:0}, wake:{d:0,p:0}, lect:{d:0,p:0}};

      const dur = (b.e - b.s) / 60, done = !!S.done[b.id];
      if (r[b.cat] && b.cat !== 'lect'){ if (!b.opt) r[b.cat].p += dur; if (done) r[b.cat].d += dur; }
      if (b.tk && b.s === 22 * 60 + 30){ if (d < t || (d === t && m >= 23 * 60)) r.bed.p++; if (done) r.bed.d++; }
      if (b.tk && b.s === 7 * 60){ if (d <= t) r.wake.p++; if (done) r.wake.d++; }
    }
    for (const x of sessionsOn(d)) if (x.kind === 'lecture' && isDue(x)){ r.lect.p++; if (covered(x.id)) r.lect.d++; }

}

function avg7(d){
  const from = addD(d, -6), v = wEntries().filter(x => x.d >= from && x.d <= d);
  return v.length >= 3 ? v.reduce((a, x) => a + x.kg, 0) / v.length : null;
}
function weightAdvice(){
  const e = wEntries(); if (!e.length) return {txt:'Weigh yourself first thing in the morning, after the toilet, a few times a week. The 7-day average is what counts, not single days.'};
  const last = e[e.length - 1].d, a = avg7(last), b14 = avg7(addD(last, -14)), b21 = avg7(addD(last, -21));
  if (a == null) return {txt:'A few more weigh-ins this week and the 7-day average appears.'};
  if (b14 == null) return {avg:a, txt:'Keep logging. After two weeks the app compares your averages.'};
  const ch = a - b14;
  if (ch < 0.15){
    const flat3 = b21 != null && a - b21 < 0.2;
    return {avg:a, ch, flat:true, txt:'Your average has been flat for ' + (flat3 ? 'three' : 'two') + ' weeks (' + (ch >= 0 ? '+' : '') + ch.toFixed(1) + ' kg). If you have eaten the plan consistently, eat a little more: about 250–400 kcal a day, such as a second bowl of cereal or an extra bagel. Check again in two weeks.'};
  }
  // 4.5: a lean bulk gains at most about 0.5% of bodyweight a week, so more than 1% in two weeks is too fast
  const fast = Math.max(0.4, Math.round(a * 0.01 * 10) / 10);
  if (ch > fast) return {avg:a, ch, fast:true, txt:'Up ' + ch.toFixed(1) + ' kg in two weeks. A lean bulk needs at most about ' + fast.toFixed(1) + ' kg (1% of your weight). Eat about 200 kcal a day less, such as one bagel fewer, and check again in two weeks.'};
  return {avg:a, ch, txt:'Up ' + ch.toFixed(1) + ' kg in two weeks. On track for a lean bulk toward ' + S.prefs.goalKg + ' kg. Keep going.'};
}

function sparkSvg(){

    (line.split(' ').length > 1 ? '<polyline points="' + line + '" fill="none" stroke="var(--study)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>' : '') + '</svg>';

/* ================= WEEK ================= */
const PX = 48 / 60, START = 7 * 60, END = 23 * 60;
function renderWeek(){
  const t = today(), ws = viewWeek || weekStart(t), m = nowM();
  const days = [0,1,2,3,4,5,6].map(i => addD(ws, i));
  const we = days[6], sameM = dOf(ws).getMonth() === dOf(we).getMonth();
  let gut = '<div class="gut" style="height:' + (END - START) * PX + 'px">';
  for (let h = 8; h < 23; h++) gut += '<span style="top:' + (h * 60 - START) * PX + 'px">' + pad(h) + ':00</span>';
  gut += '</div>';
  const cols = days.map(d => {
    const bl = dayBlocks(d).map(b => {
      if (b.live) return '';
      const s = Math.max(b.s, START), e = Math.min(b.e, END); if (e <= s) return '';
      const st = stOf(b, d);
      return '<div class="blk c-' + b.cat + (st.done ? ' done' : '') + (st.missed ? ' missed' : '') + '" style="top:' + (s - START) * PX + 'px;height:' + Math.max(10, (e - s) * PX - 2) + 'px" data-act="open" data-d="' + d + '" data-id="' + esc(b.id) + '" title="' + esc(tm(b.s) + '–' + tm(b.e) + ' ' + bTitle(b, d)) + '">' +
        (e - s >= 45 ? '<span class="t">' + tm(b.s) + '</span>' : '') + '<b>' + esc(bTitle(b, d)) + '</b></div>';
    }).join('');
    const nl = d === t && m >= START && m < END ? '<div class="nowline" style="top:' + (m - START) * PX + 'px"></div>' : '';
    return '<div class="col' + (d === t ? ' today' : '') + '" style="height:' + (END - START) * PX + 'px">' + bl + nl + '</div>';
  }).join('');
  const heads = '<div class="dh"></div>' + days.map(d => '<div class="dh' + (d === t ? ' today' : '') + '">' + dayName(d, true) + ' ' + dOf(d).getDate() + '<small>' + (dayBlocks(d).campus ? 'Campus' : 'Home') + '</small></div>').join('');
  const list = days.map(d => '<h3>' + dayName(d) + '<small>' + niceDate(d) + '. ' + (dayBlocks(d).campus ? 'Campus day' : 'Home day') + (d === t ? ', today' : '') + '.</small></h3>' + agendaHtml(d, false)).join('');
  view.innerHTML = ghost() + '<div class="topbar"><div><h1>Week</h1><div class="sub">' + dOf(ws).getDate() + (sameM ? '' : ' ' + MONTHS[dOf(ws).getMonth()]) + ' to ' + niceDate(we) + '. ' + esc(periodSentence(ws).replace(/^./, c => c.toUpperCase())) + '.</div></div>' +
    '<div class="row-flex" style="flex-wrap:nowrap"><button class="btn small sq" data-act="wprev" aria-label="Previous week">' + ic('left', 'width:18px;height:18px') + '</button>' + (ws === weekStart(t) ? '' : '<button class="btn small" data-act="wtoday">This week</button>') + '<button class="btn small sq" data-act="wnext" aria-label="Next week">' + ic('right', 'width:18px;height:18px') + '</button></div></div>' +
    '<div class="wk">' + heads + gut + cols + '</div><div class="wklist">' + list + '</div>' +
    '<div style="margin-top:30px;max-width:560px">' + weekCard(ws, ws === weekStart(t) ? 'This week' : 'That week') + '</div>';
}

/* ================= BEHIND ================= */
/* Lecture tracker (4.6). Term tabs, then each teaching week in its own hand-drawn box whose heading stays in view while you
   scroll it. Done sessions (covered and notes made) are struck through; weeks with nothing to do fold to one line.
   One set of markup, two layouts chosen by the space available: a line per session on a phone, a column per weekday on a laptop. */
const TERMS = [['AT', 'Autumn'], ['WT', 'Winter'], ['ST', 'Spring']];
const TERM_OF = {AT:'AT', XMAS:'AT', JAN:'AT', WT:'WT', SPRING:'WT', ST:'ST', SUMMER:'ST', OUT:'AT'};
let trackTerm = null, trackScroll = false;
const twOpen = new Map();
const KIND = {lecture:'Lecture', class:'Class', help:'Help', workshop:'Workshop'};
function trackState(x){
  const past = isPastS(x), cov = covered(x.id), nts = !!S.notes[x.id], sol = !!S.done['sol|' + x.id];
  const tag = past && !cov ? (x.kind === 'lecture' ? (isDue(x) ? ['bad', 'behind'] : ['', 'to watch']) : x.kind === 'help' ? ['', 'optional'] : sol ? ['good', 'solutions done'] : ['bad', 'missed']) : null;
  const done = cov && nts, open = past && (tag ? tag[0] === 'bad' : cov && !nts);
  return {past, cov, nts, tag, done, open, behind:!!(tag && tag[0] === 'bad')};
}
const tagHtml = s => s.tag ? '<span class="tag' + (s.tag[0] ? ' ' + s.tag[0] : '') + '">' + s.tag[1] + '</span>' : '';
// The labelled buttons, as before. "back" and "made" drop off when the space is narrow.
function pills(x){
  const t = (f, l, lg) => { const on = !!S[f][x.id];
    return '<button class="tk' + (on ? ' on' : '') + '" data-act="lt" data-f="' + f + '" data-id="' + esc(x.id) + '" aria-pressed="' + on + '" aria-label="' + l + (lg || '') + ': ' + esc(x.label) + ', ' + sessWhen(x) + '">' + (on ? tickSvg() : '') + l + (lg ? '<span class="lg">' + lg + '</span>' : '') + '</button>'; };
  return '<div class="ticks c-lse">' + t('att', 'Attended') + t('wat', 'Watched', ' back') + t('notes', 'Notes', ' made') + '</div>';
}
function weekHead(ws, p, st, xs, isNow){
  const wn = Math.floor(daysBetween(p.wk, ws) / 7) + 1, past = st.filter(s => s.past).length, cov = st.filter(s => s.past && s.cov).length, behind = st.filter(s => s.behind).length;
  const allDone = past === xs.length && st.every(s => s.done || (s.tag && (s.tag[1] === 'optional' || s.tag[1] === 'solutions done')));
  const we = addD(ws, 4), sameM = dOf(ws).getMonth() === dOf(we).getMonth();
  const dates = dOf(ws).getDate() + (sameM ? '' : ' ' + MONTHS[dOf(ws).getMonth()].slice(0, 3)) + '–' + dOf(we).getDate() + ' ' + MONTHS[dOf(we).getMonth()].slice(0, 3);
  const status = !past ? '<span class="wst">' + xs.length + ' coming up</span>' : allDone ? '<span class="wst good">All ' + xs.length + ' done ✓</span>'
    : '<span class="wst"><b class="hand">' + cov + ' of ' + past + '</b> covered</span>' + (behind ? '<span class="tag bad">' + behind + ' behind</span>' : '');
  return {allDone, html:'<summary class="whead"><span class="wn hand">Week ' + wn + '</span><span class="wdates">' + dates + (p.reading === wn ? ', reading week' : '') + '</span>' +
    (isNow ? '<span class="tag good">this week</span>' : '') + '<span class="wsum">' + status + '</span></summary>'};
}
// The days of a week. Weekday columns stay in place on a laptop (Monday always first), so empty days are kept but hidden on a phone.
function weekBody(xs, st){
  const by = {}; xs.forEach((x, i) => { const k = (dow(x.date) + 6) % 7 + 1; (by[k] = by[k] || []).push(i); });
  const nd = Math.max(5, ...Object.keys(by).map(Number)), ws = weekStart(xs[0].date);
  let h = '';
  for (let k = 1; k <= nd; k++){
    const d = addD(ws, k - 1), ix = by[k] || [];
    h += '<div class="dgrp' + (ix.length ? '' : ' empty') + '"><div class="dname"><b>' + dayName(d, true) + '</b><span class="hand">' + dOf(d).getDate() + '</span></div><div class="dlist">' +
      (ix.length ? ix.map(i => { const x = xs[i], s = st[i];
        return '<div class="sess' + (s.done ? ' done' : '') + (s.past ? '' : ' up') + '"><div class="sinfo"><span class="l1"><b>' + esc(x.label) + '</b>' + tagHtml(s) + '</span><small>' + tm(x.s) + '–' + tm(x.e) + '</small></div>' + pills(x) + '</div>'; }).join('')
        : '<p class="dnone">No sessions</p>') + '</div></div>';
  }
  return '<div class="wdays" style="--nd:' + nd + '">' + h + '</div>';
}
function trackerHtml(){
  const t = today(), term = trackTerm || TERM_OF[periodOf(t).id] || 'AT', p = PERIODS.find(z => z.id === term), tw = weekStart(t);
  const list = ALLSESS.filter(x => x.kind !== 'qa' && x.date >= p.from && x.date <= p.to).sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.s - b.s);
  const weeks = new Map(); for (const x of list){ const k = weekStart(x.date); if (!weeks.has(k)) weeks.set(k, []); weeks.get(k).push(x); }
  let pc = 0, pn = 0, beh = 0, nw = 0;
  for (const x of list){ const s = trackState(x); if (!s.past) continue; pn++; if (s.cov) pc++; if (s.behind) beh++; if (s.cov && !s.nts) nw++; }
  const tabs = '<div class="seg" style="display:flex;margin:0 0 6px" role="group" aria-label="Term">' + TERMS.map(([id, l]) => '<button data-act="tterm" data-t="' + id + '" aria-pressed="' + (term === id) + '">' + l + '</button>').join('') + '</div>';
  const name = p.lc.replace(/^./, c => c.toUpperCase());
  const sum = pn ? 'So far: ' + pc + ' of ' + pn + ' sessions covered' + (beh ? ', ' + beh + ' behind' : '') + (nw ? ', ' + nw + ' to write notes for' : '') + '.'
    : list.length ? 'Nothing has happened yet. ' + list.length + ' sessions are planned.' : 'No lectures or classes in this term.';
  const blocks = [...weeks.entries()].map(([ws, xs]) => {
    const st = xs.map(trackState), isNow = ws === tw, H = weekHead(ws, p, st, xs, isNow);
    const open = twOpen.has(ws) ? twOpen.get(ws) : (isNow || st.some(s => s.open));
    return '<details class="wbox' + (isNow ? ' now' : '') + '" data-wk="' + ws + '"' + (open ? ' open' : '') + '>' + H.html +
      '<div class="wbody">' + weekBody(xs, st) + '</div></details>';
  }).join('');
  return tabs + '<div class="termh"><span class="hand">' + esc(name) + '</span><span class="tsum">' + esc(sum) + '</span></div>' + blocks;
}
