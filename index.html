<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Life Planner</title>
<meta name="theme-color" content="#f3f4f7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ---------- themes (set per device in Setup) ---------- */
:root{
  --bg:#f3f4f7; --panel:#ffffff; --panel2:#f7f8fa; --ink:#1b1d22; --muted:#555b67; --line:#e3e6ec;
  --accent:#3557c7; --accent-ink:#ffffff; --soft:#e6ebfb; --soft-ink:#23409c;
  --bad:#b4441c; --bad-soft:#fbeee6; --good:#2f7d4f; --warn:#8a5a00; --warn-soft:#fdf0e4;
  --routine:#6f7887; --meal:#b7791f; --lse:#7a4fc2; --study:#2f6fd0; --academy:#0f8a7e; --gym:#c4443a;
  --business:#2f8a4f; --career:#b04a7f; --travel:#7d8591; --chores:#9b6530; --free:#a3a29b; --admin:#4c5c8e;
  --shadow:0 1px 2px rgba(20,30,60,.05),0 4px 16px rgba(20,30,60,.05);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141517; --panel:#1d2023; --panel2:#24272b; --ink:#ecebe6; --muted:#a3a29b; --line:#2c3034;
    --accent:#8fc7a8; --accent-ink:#10261b; --soft:#23322a; --soft-ink:#b8dcc8;
    --bad:#f08a6c; --bad-soft:#33231d; --good:#8fc7a8; --warn:#ebbd76; --warn-soft:#2a241b;
    --routine:#9aa3b2; --meal:#e0b25e; --lse:#b39ae8; --study:#7fa8e0; --academy:#6cc3b5; --gym:#ef7f73;
    --business:#9fd0a0; --career:#f2a7c9; --travel:#9aa0aa; --chores:#d0a070; --free:#7d7c76; --admin:#96a3d4;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141517; --panel:#1d2023; --panel2:#24272b; --ink:#ecebe6; --muted:#a3a29b; --line:#2c3034;
  --accent:#8fc7a8; --accent-ink:#10261b; --soft:#23322a; --soft-ink:#b8dcc8;
  --bad:#f08a6c; --bad-soft:#33231d; --good:#8fc7a8; --warn:#ebbd76; --warn-soft:#2a241b;
  --routine:#9aa3b2; --meal:#e0b25e; --lse:#b39ae8; --study:#7fa8e0; --academy:#6cc3b5; --gym:#ef7f73;
  --business:#9fd0a0; --career:#f2a7c9; --travel:#9aa0aa; --chores:#d0a070; --free:#7d7c76; --admin:#96a3d4;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;font-weight:750;letter-spacing:-.015em}
.muted{color:var(--muted)}
.small{font-size:14px}
a{color:var(--accent)}

/* category colour hook */
.c-routine{--c:var(--routine)} .c-meal{--c:var(--meal)} .c-lse{--c:var(--lse)} .c-study{--c:var(--study)}
.c-academy{--c:var(--academy)} .c-gym{--c:var(--gym)} .c-business{--c:var(--business)} .c-travel{--c:var(--travel)}
.c-chores{--c:var(--chores)} .c-free{--c:var(--free)} .c-admin{--c:var(--admin)} .c-career{--c:var(--career)}

/* ---------- shell ---------- */
#app{min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
main{padding:14px 0 calc(110px + env(safe-area-inset-bottom))}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 0 4px}
.topbar h1{font-size:30px;line-height:1.15}
.topbar .sub{color:var(--muted);font-size:15px;margin-top:2px}
.pillbtn{border:0;border-radius:999px;background:var(--soft);color:var(--soft-ink);font-weight:700;font-size:14px;padding:8px 13px;white-space:nowrap}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;background:var(--panel);border-top:1px solid var(--line);padding:6px 4px calc(8px + env(safe-area-inset-bottom))}
.bottomnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:60px;min-height:54px;padding:4px;color:var(--muted);font-size:12.5px;font-weight:600;position:relative}
.bottomnav .ic{display:flex;padding:4px 18px;border-radius:999px}
.bottomnav button[aria-current="page"]{color:var(--ink);font-weight:750}
.bottomnav button[aria-current="page"] .ic{background:var(--soft);color:var(--soft-ink)}
.badge{position:absolute;top:2px;right:10px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:800;line-height:18px;text-align:center}
.badge:empty{display:none}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* layout C: sidebar dashboard */
body.L-C .wrap{max-width:1360px}
body.L-C #app{display:grid;grid-template-columns:232px minmax(0,1fr)}
.sidenav{position:sticky;top:0;height:100vh;padding:20px 14px;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:4px}
.sidenav .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.sidenav .logo{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800}
.sidenav .clock{font-size:13px;color:var(--muted)}
.sidenav button.nav{display:flex;align-items:center;gap:12px;border:0;background:none;border-radius:12px;padding:10px 12px;color:var(--muted);font-weight:600;text-align:left;position:relative}
.sidenav button.nav:hover{background:var(--panel2);color:var(--ink)}
.sidenav button.nav[aria-current="page"]{background:var(--soft);color:var(--soft-ink)}
.sidenav button.nav .badge{position:static;margin-left:auto}
.sidenav .spacer{flex:1}
body.L-C main{padding:22px 8px 60px}
@media (max-width:860px){
  body.L-C #app{display:block}
  body.L-C .sidenav{position:sticky;top:0;z-index:30;height:auto;flex-direction:row;overflow-x:auto;padding:8px;border-right:0;border-bottom:1px solid var(--line)}
  body.L-C .sidenav .brand,body.L-C .sidenav .spacer{display:none}
  body.L-C .sidenav button.nav{white-space:nowrap;padding:8px 10px}
}
.dash{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) minmax(0,.95fr);gap:18px;align-items:start}
.dash>div{display:flex;flex-direction:column;gap:16px}
@media (max-width:1180px){.dash{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}.dash>div:nth-child(3){grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}}
@media (max-width:760px){.dash{grid-template-columns:1fr}.dash>div:nth-child(3){display:flex}}

/* ---------- cards & controls ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:16px 18px;box-shadow:var(--shadow)}
.card+.card{margin-top:14px}
.dash .card+.card,.cols .card+.card{margin-top:0}
.card h2{font-size:17px;margin-bottom:10px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.card h2 .r{font-size:14px;font-weight:700;color:var(--muted)}
.sec{font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.btn{border:1px solid var(--line);background:var(--panel);min-height:44px;padding:8px 14px;border-radius:14px;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:color-mix(in srgb,var(--ink) 25%,var(--line))}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.soft{background:var(--soft);border-color:transparent;color:var(--soft-ink)}
.btn.small{min-height:36px;padding:5px 11px;font-size:14px;border-radius:12px}
.btn.danger{color:var(--bad)}
.btn.wide{width:100%}
.row-flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 7px;border-radius:7px;background:var(--panel2);color:var(--muted);vertical-align:1px;margin-left:5px;border:1px solid var(--line)}
.tag.bad{color:var(--bad);background:var(--bad-soft);border-color:transparent}
.tag.warn{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.tag.good{color:var(--good);border-color:transparent;background:color-mix(in srgb,var(--good) 14%,transparent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel);flex-wrap:wrap}
.seg button{border:0;background:none;min-height:40px;padding:6px 14px;color:var(--muted);font-weight:650}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px 11px;min-height:44px;min-width:0;width:100%}
textarea{min-height:110px;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:650;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fgrid .full{grid-column:1/-1}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:1fr}}
body:not(.L-C) .cols{grid-template-columns:1fr}

/* week strip & tiles */
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:12px}
.strip button{min-height:56px;border:0;border-radius:16px;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;box-shadow:var(--shadow)}
.strip button span{font-size:12px;font-weight:600;color:var(--muted)}
.strip button b{font-size:17px}
.strip button[aria-current="date"]{background:var(--accent);color:var(--accent-ink)}
.strip button[aria-current="date"] span{color:inherit}
.strip button.today:not([aria-current="date"]) b{color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.tile{border:0;text-align:left;padding:10px 12px;border-radius:16px;background:var(--panel);display:flex;flex-direction:column;gap:1px;box-shadow:var(--shadow);min-width:0}
.tile span{font-size:12.5px;font-weight:650;color:var(--muted)}
.tile b{font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.warn{background:var(--warn-soft)} .tile.warn span,.tile.warn b{color:var(--warn)}

/* agenda list */
.agenda{list-style:none;margin:12px 0 0;padding:6px;background:var(--panel);border-radius:24px;box-shadow:var(--shadow);border:1px solid var(--line)}
.it{display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:16px;cursor:pointer}
.it:hover{background:var(--panel2)}
.it .tm{width:46px;flex:none;font-size:14px;color:var(--muted);font-weight:600}
.it .dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.it .tx{flex:1;min-width:0}
.it .tt{font-size:16px;font-weight:650;line-height:1.3}
.it .sb{font-size:13.5px;color:var(--muted);margin-top:1px}
.it .sb.bad{color:var(--bad);font-weight:700}
.it .sb.hint{color:var(--soft-ink)}
.it.cur{background:var(--soft)}
.it.cur .tm,.it.cur .sb{color:var(--soft-ink)}
.it.done .tt{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--ink) 30%,transparent)}
.it.missed .dot{background:var(--bad)}
.it.travel .tt{font-weight:550}
.chk{width:34px;height:34px;border-radius:50%;border:2px solid color-mix(in srgb,var(--c) 45%,var(--line));background:transparent;display:grid;place-items:center;flex:none;color:transparent;padding:0}
.chk svg{width:18px;height:18px;stroke:currentColor;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.chk.on{background:var(--c);border-color:var(--c);color:#fff}
.chk:hover:not(.on){color:color-mix(in srgb,var(--c) 70%,transparent)}
.freeln{padding:6px 10px 8px 68px;font-size:13.5px;color:var(--muted)}
.fold{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:10px;color:var(--muted);font-size:14px;font-weight:650;text-align:left;border-radius:14px}
.fold:hover{background:var(--panel2)}
.ticks{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.tk{border:1px solid var(--line);background:var(--panel2);border-radius:10px;min-height:34px;padding:3px 10px;font-size:13px;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.tk.on{background:var(--good);border-color:var(--good);color:#fff}
:root[data-theme="dark"] .tk.on{color:#10261b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tk.on{color:#10261b}}
.fab{position:fixed;right:18px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:25;width:58px;height:58px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 6px 18px rgba(30,50,120,.28)}
body.L-C .fab{bottom:24px;right:24px}

/* focus layout A */
.focus{margin-top:18px;padding:22px;background:var(--panel);border-radius:28px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line);box-shadow:var(--shadow)}
.focus .lbl{font-size:12.5px;font-weight:800;letter-spacing:.12em;color:var(--c,var(--accent));text-transform:uppercase}
.focus .big{font-size:34px;line-height:1.12;font-weight:750;letter-spacing:-.02em}
.focus p{margin:0;color:var(--muted);font-size:16px}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;border-radius:3px;background:var(--c,var(--accent))}
.focus .acts{display:flex;gap:10px}
.focus .acts .btn{min-height:52px;border-radius:16px;font-size:16px}
.focus .acts .btn.primary{flex:1;background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:var(--panel)}
.nextlist{margin-top:22px}
.nextlist .it{padding:12px 4px;border-radius:0;border-top:1px solid var(--line)}
.nextlist .it:first-of-type{border-top:0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 12px;font-size:14px;font-weight:650}
.chip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}

/* stats bars */
.bars{display:grid;grid-template-columns:minmax(80px,auto) minmax(0,1fr) auto;gap:10px 12px;align-items:center;font-size:14.5px}
.bars .lb{font-weight:650}
.bars .track{height:8px;border-radius:4px;background:var(--panel2);border:1px solid var(--line);overflow:hidden;display:block}
.bars .track i{display:block;height:100%;background:var(--c,var(--accent))}
.bars .v{text-align:right;color:var(--muted);white-space:nowrap}

/* lists in Behind / Deadlines */
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.card h2+.li,.li.first{border-top:0}
.li .tx{flex:1;min-width:0}
.li .t{font-weight:650}
.li .s{font-size:13.5px;color:var(--muted)}
.li .s.bad{color:var(--bad);font-weight:700}
.li .s.hint{color:var(--soft-ink)}
.code{font-size:11.5px;font-weight:800;color:var(--muted);letter-spacing:.03em;width:54px;flex:none}
.empty{color:var(--muted);margin:4px 0}
details>summary{cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}

/* week grid */
.wk{display:grid;grid-template-columns:48px repeat(7,minmax(0,1fr));background:var(--panel);border:1px solid var(--line);border-radius:20px;overflow:hidden;margin-top:14px}
.wk .dh{padding:8px 4px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);font-size:13.5px;font-weight:750;text-align:center}
.wk .dh small{display:block;color:var(--muted);font-weight:500}
.wk .dh.today{color:var(--accent)}
.wk .gut{position:relative}
.wk .gut span{position:absolute;right:6px;font-size:11px;color:var(--muted);transform:translateY(-7px)}
.wk .col{position:relative;border-left:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 48px}
.wk .col.today{background-color:color-mix(in srgb,var(--accent) 5%,transparent)}
.blk{position:absolute;left:3px;right:3px;border-radius:8px;background:color-mix(in srgb,var(--c) 17%,var(--panel));border-left:3px solid var(--c);font-size:11.5px;line-height:1.25;padding:2px 5px;overflow:hidden;cursor:pointer}
.blk.c-free{background:transparent;border-left-style:dotted;color:var(--muted)}
.blk b{font-weight:650;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .t{color:var(--muted);font-size:10.5px}
.blk.done{opacity:.55}
.blk.missed{outline:1.5px dashed color-mix(in srgb,var(--bad) 70%,transparent)}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--bad);z-index:3}
.wklist{display:none}
body:not(.L-C) .wk{display:none} body:not(.L-C) .wklist{display:block}
@media (max-width:900px){body.L-C .wk{display:none}body.L-C .wklist{display:block}}
.wklist h3{margin:18px 0 0;font-size:16px}

/* gym */
.ex{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.ex+.ex{margin-top:12px}
.ex .hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ex .nm{font-size:18px;font-weight:750}
.ex .rx{font-size:13.5px;color:var(--muted);text-align:right}
.ex .last{font-size:14px;color:var(--muted)}
.ex .up{font-size:14px;color:var(--good);font-weight:650}
.setrow{display:grid;grid-template-columns:52px minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center}
.setrow span{font-size:13.5px;color:var(--muted)}
.setrow input{text-align:center;font-size:16px}
.gymhead{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

/* food */
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:8px;border-top:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-top:0}
td input{min-height:38px;padding:6px 8px;font-size:14px}
.tablewrap{overflow-x:auto}
.shop{list-style:none;margin:0;padding:0}
.shop li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.shop li:first-child{border-top:0}
.shop input[type=checkbox]{width:22px;height:22px;accent-color:var(--good);flex:none}
.shop li.got span{text-decoration:line-through;color:var(--muted)}
.shop .x{margin-left:auto;border:0;background:none;color:var(--muted);min-width:36px;min-height:36px;font-size:16px}
.prose p{margin:0 0 10px}.prose ul{margin:0 0 10px;padding-left:20px}.prose li{margin:4px 0}
.spark{width:100%;height:90px;display:block}

/* setup */
.sw{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0;border-top:1px solid var(--line)}
.card h2+.sw{border-top:0}
.sw small{display:block;color:var(--muted);font-size:13.5px}
.tog{position:relative;width:50px;height:30px;border-radius:15px;border:0;background:var(--line);flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.tog[aria-checked="true"]{background:var(--good)}
.tog[aria-checked="true"]::after{left:23px}
.cat{border:1px solid var(--line);background:var(--panel2);border-radius:16px;padding:6px 12px;font-size:14px;font-weight:600;color:var(--muted)}
.cat[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 18%,var(--panel));border-color:var(--c);color:var(--ink)}

<script>
(function(){
'use strict';

/* ================= time helpers ================= */
const params = new URLSearchParams(location.search);
let OFFSET = 0;
if (params.get('now')) { const t = new Date(params.get('now')); if (!isNaN(t)) OFFSET = t.getTime() - Date.now(); }
const now = () => new Date(Date.now() + OFFSET);
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const dOf = s => { const a = s.split('-').map(Number); return new Date(a[0], a[1] - 1, a[2]); };
const addD = (s, n) => { const d = dOf(s); d.setDate(d.getDate() + n); return iso(d); };
const dow = s => dOf(s).getDay();
const hm = s => { const a = s.split(':').map(Number); return a[0] * 60 + a[1]; };
const tm = m => pad(Math.floor(m / 60)) + ':' + pad(m % 60);
const at = (s, m) => { const a = s.split('-').map(Number); return new Date(a[0], a[1] - 1, a[2], Math.floor(m / 60), m % 60); };
const today = () => iso(now());
const nowM = () => { const n = now(); return n.getHours() * 60 + n.getMinutes(); };
const daysBetween = (a, b) => Math.round((dOf(b) - dOf(a)) / 864e5);
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const dayName = (s, short) => { const n = DAYS[dow(s)]; return short ? n.slice(0, 3) : n; };
const niceDate = (s, short) => { const d = dOf(s); return (short ? DAYS[d.getDay()].slice(0, 3) + ' ' : '') + d.getDate() + ' ' + (short ? MONTHS[d.getMonth()].slice(0, 3) : MONTHS[d.getMonth()]); };
const weekStart = s => { const w = dow(s); return addD(s, w === 0 ? -6 : 1 - w); };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hrs = x => (Math.round(x * 4) / 4) + 'h';
const o = (...a) => Object.assign({}, ...a);

/* ================= storage ================= */
const KEY = 'hlp1_state', DKEY = 'hlp1_device';
const APP_VERSION = '3.0';
const APP_URL = 'hemsaivp.github.io/life-planner';
const V3_START = '2026-10-12';   // career blocks and new features start here; earlier days stay as they were
const defAlerts = () => ({banner:true, system:false, sound:false, vibrate:false, leave:true, bedtime:'lock',
  cats:{lse:true, study:true, academy:true, gym:true, business:true, career:true, meal:true, chores:true, admin:true}});
const defPrefs = () => ({budget:35, careerMin:60, careerBreakMin:120, gymMin:4, gymMax:5, homeMin:2, homeMax:3,
  proteinLo:120, proteinHi:130, startKg:58, goalKg:65});
const SHOP_DEF = {
  sat:['Chicken thighs, about 1.5 kg (curry, stir-fry, wraps)','Eggs ×15','Milk, 4 pints','Greek-style yoghurt 1 kg','Oats 1 kg',
       'Rice 1 kg','Pasta 1 kg','Wraps ×8','Bread, 1 loaf','Potatoes 2.5 kg','Onions, garlic','Tinned tomatoes ×3',
       'Red lentils 500 g (or 2 tins)','Chickpeas ×2','Tuna ×3 tins','Frozen mixed veg and spinach','Peanut butter','Bananas, apples'],
  wed:['Milk','Bananas','Peppers ×3','Cheese (block), if low','Bread or wraps, if low','Anything you ran out of']
};
const PLAN_DEF = [
  ['Mon','Oats: milk, banana, peanut butter','Chicken curry + rice (Sunday batch)','Tuna pasta with frozen veg'],
  ['Tue','3 eggs on toast + fruit','Chicken curry + rice','Chicken stir-fry, rice, frozen veg'],
  ['Wed','Oats + yoghurt','Chicken curry + rice','Lentil bolognese pasta bake (Wednesday batch)'],
  ['Thu','Overnight oats (made Wed night)','Pasta bake','Chicken wraps, peppers, yoghurt'],
  ['Fri','Eggs on toast','Pasta bake','Chicken wraps + salad (Friday fakeaway)'],
  ['Sat','Oats or eggs','Jacket potato, tuna, cheese','Egg fried rice with veg'],
  ['Sun','Eggs and beans on toast','Leftovers or eggs','Chicken curry (Sunday batch, first portion)']
];
const blank = () => ({v:3, done:{}, att:{}, wat:{}, notes:{}, custom:[], edits:[], shop:{},
  shopList:{sat:SHOP_DEF.sat.slice(), wed:SHOP_DEF.wed.slice()}, meals:PLAN_DEF.map(r => r.slice()),
  nights:{}, snoozeUntil:0, alerts:defAlerts(), prefs:defPrefs(), gym:{sessions:[], next:1, home:[], draft:null},
  weights:{}, welcomed:false, lastBackup:null, lastVersion:null});

function normalise(obj){
  const st = Object.assign(blank(), obj);
  const a = obj.alerts || {};
  st.alerts = Object.assign(defAlerts(), a);
  st.alerts.cats = Object.assign(defAlerts().cats, a.cats || {});
  st.prefs = Object.assign(defPrefs(), obj.prefs || {});
  st.gym = Object.assign({sessions:[], next:1, home:[], draft:null}, obj.gym || {});
  for (const k of ['done','att','wat','notes','shop','nights','weights']) if (!st[k] || typeof st[k] !== 'object') st[k] = {};
  for (const k of ['custom','edits']) if (!Array.isArray(st[k])) st[k] = [];
  if (!st.shopList || !Array.isArray(st.shopList.sat)) st.shopList = {sat:SHOP_DEF.sat.slice(), wed:SHOP_DEF.wed.slice()};
  if (!Array.isArray(st.meals) || st.meals.length !== 7) st.meals = PLAN_DEF.map(r => r.slice());
  if (!obj.v || obj.v < 3){
    // Version 2 had one tick per session ("attended or watched"). Keep it as attended (in person) or watched (at home).
    const base = buildSessions([]);
    for (const x of base.all){
      if (!obj.done || !obj.done[x.id]) continue;
      const campus = (base.byDate[x.date] || []).some(y => y.kind === 'class' || y.kind === 'workshop');
      const inPerson = x.kind === 'class' || x.kind === 'workshop' || x.kind === 'qa' || (x.kind === 'lecture' && campus);
      if (inPerson) st.att[x.id] = true; else st.wat[x.id] = true;
    }
    const ex = obj.shopExtra || {};
    st.shopList = {sat:[...SHOP_DEF.sat, ...(ex.sat || [])], wed:[...SHOP_DEF.wed, ...(ex.wed || [])]};
    st.shop = {};
    delete st.shopExtra;
    st.v = 3;
  }
  delete st.sound;
  return st;
}
let S;
const sid = (d, c, k, s) => 's|' + d + '|' + c + '|' + k + '|' + s;
function seed(){
  // Copied from Timetable_Tracker.xlsx (weeks 1–2).
  const W = [['2026-09-28','EC2C1','lecture','11:00','w'],['2026-09-29','EC2B1','lecture','09:00','w'],['2026-09-29','EC2C1','lecture','15:00','w'],
             ['2026-10-01','EC2A1','lecture','12:00','w'],['2026-10-02','FM214','lecture','11:00','w'],['2026-10-05','EC2B1','class','14:00','a'],
             ['2026-10-08','EC2A1','lecture','12:00','a']];
  for (const [d,c,k,s,how] of W){ const id = sid(d,c,k,s); (how === 'a' ? S.att : S.wat)[id] = true; S.notes[id] = true; }
}
function load(){
  let obj = null;
  try { const r = localStorage.getItem(KEY); if (r) obj = JSON.parse(r); } catch(e) {}
  if (obj && typeof obj === 'object' && obj.done) { S = normalise(obj); save(); }
  else { S = blank(); seed(); save(); }
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); return true; }
  catch(e) { toast('This browser blocked saving. Export a backup from Setup.'); return false; }
}

/* ---------- this device's look (not part of backups) ---------- */
const ACCENTS = {light:['#3557c7','#0f7a70','#6a4bc4','#b4542a'], dark:['#8fc7a8','#9db8e8','#e6b37a','#c9a7f0']};
let DEV = {};
const looksLikePhone = () => matchMedia('(max-width: 760px)').matches || (matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) < 600);
function loadDev(){
  let d = null;
  try { d = JSON.parse(localStorage.getItem(DKEY) || 'null'); } catch(e) {}
  const phone = looksLikePhone();
  DEV = Object.assign({phone, layout: phone ? 'B' : 'C', theme: phone ? 'light' : 'dark', accent:null}, d && typeof d === 'object' ? d : {});
}
function saveDev(){ try { localStorage.setItem(DKEY, JSON.stringify(DEV)); } catch(e) {} }
const isDark = () => DEV.theme === 'dark' || (DEV.theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
function applyDev(){
  const r = document.documentElement;
  if (DEV.theme === 'auto') r.removeAttribute('data-theme'); else r.dataset.theme = DEV.theme;
  const pal = isDark() ? ACCENTS.dark : ACCENTS.light;
  const acc = DEV.accent != null && pal[DEV.accent] ? pal[DEV.accent] : null;
  if (acc){ r.style.setProperty('--accent', acc); r.style.setProperty('--c-accent', acc); }
  else { r.style.removeProperty('--accent'); }
  document.body.classList.remove('L-A', 'L-B', 'L-C');
  document.body.classList.add('L-' + DEV.layout);
  const tc = getComputedStyle(document.body).getPropertyValue('--bg').trim();
  const m = document.querySelector('meta[name="theme-color"]'); if (m && tc) m.setAttribute('content', tc);
}

/* ================= LSE timetable (from your Google Calendar) ================= */
const COURSE = {EC2A1:'Microeconomics II', EC2B1:'Macroeconomics II', EC2C1:'Econometrics II', FM214:'Principles of Finance I',
  FM215:'Principles of Finance II', EC260P:'EC260P', BUS:'Business', OTHER:'Other'};
// [code, kind, weekday, start, end, from, to, except, only, label]
const RULES = [
  // Autumn Term 2026
  ['EC2C1','lecture',1,'11:00','12:00','2026-09-28','2026-12-07'],
  ['EC2B1','class',  1,'14:00','15:00','2026-10-05','2026-12-07'],
  ['EC2A1','qa',     1,'17:00','18:00',null,null,null,['2026-10-12','2026-10-26','2026-11-09','2026-11-23','2026-12-07']],
  ['EC2B1','lecture',2,'09:00','11:00','2026-09-29','2026-12-08'],
  ['EC2C1','lecture',2,'15:00','17:00','2026-09-29','2026-12-08'],
  ['FM214','class',  4,'09:00','10:30','2026-10-08','2026-12-10'],
  ['EC2A1','lecture',4,'12:00','14:00','2026-10-01','2026-12-03'],
  ['EC2C1','class',  4,'17:00','18:00','2026-10-08','2026-12-10'],
  ['EC2C1','help',   5,'09:00','10:00','2026-10-02','2026-12-11'],
  ['FM214','lecture',5,'11:00','13:00','2026-10-02','2026-12-11'],
  ['EC2A1','class',  5,'16:00','17:00','2026-10-09','2026-12-11'],
  // Winter Term 2027
  ['EC2B1','lecture',1,'14:00','16:00','2027-01-11','2027-03-22',['2027-02-15']],
  ['FM215','class',  2,'09:00','10:30','2027-01-19','2027-03-23'],
  ['EC2A1','qa',     2,'11:00','12:00',null,null,null,['2027-01-26','2027-02-09','2027-02-23','2027-03-09','2027-03-23']],
  ['EC260P','workshop',2,'11:00','12:00',null,null,null,['2027-02-02','2027-03-02']],
  ['EC2C1','lecture',2,'15:00','17:00','2027-01-12','2027-03-23',['2027-02-16']],
  ['EC2A1','lecture',4,'12:00','14:00','2027-01-14','2027-03-25',['2027-02-18']],
  ['EC2C1','class',  4,'17:00','18:00','2027-01-21','2027-03-25',['2027-02-18']],
  ['EC2C1','lecture',5,'09:00','10:00',null,null,null,['2027-01-15','2027-01-22','2027-01-29','2027-02-05','2027-02-12'],'EC2C1 Stata session'],
  ['FM215','lecture',5,'11:00','13:00','2027-01-15','2027-03-26'],
  ['EC2B1','class',  5,'15:00','16:00','2027-01-22','2027-03-26',['2027-02-19']],
  ['EC2A1','class',  5,'16:00','17:00','2027-01-22','2027-03-26',['2027-02-19']],
  // Spring Term 2027 (revision week)
  ['EC2A1','lecture',1,'11:00','13:00',null,null,null,['2027-04-26']],
  ['EC2B1','lecture',1,'14:00','16:00',null,null,null,['2027-04-26']],
  ['EC2A1','lecture',4,'12:00','14:00',null,null,null,['2027-04-29']],
  ['EC2B1','class',  5,'15:00','16:00',null,null,null,['2027-04-30']],
  ['EC2A1','class',  5,'16:00','17:00',null,null,null,['2027-04-30']]
];
const KINDNAME = {lecture:'lecture', class:'class', help:'help lecture', qa:'Q&A (Zoom)', workshop:'workshop'};
const COURSES = ['EC2A1','EC2B1','EC2C1','FM214','FM215','EC260P','OTHER'];
let SESS = {}, ALLSESS = [];
// Timetable = RULES (from your calendar) + your own changes (S.edits). Rebuilt after every change.
function buildSessions(edits){
  const E = edits || [];
  const byDate = {}, all = [];
  const cancelled = new Set(E.filter(e => e.kind === 'sessCancel').map(e => e.sid));
  const stops = E.filter(e => e.kind === 'sessStop');
  const moves = {}; for (const e of E) if (e.kind === 'sessMove') moves[e.sid] = e;
  const put = x => {
    if (cancelled.has(x.id)) return;
    if (stops.some(c => c.code === x.code && c.sk === x.kind && c.wd === x.wd && c.s === x.s && x.date >= c.from && (!c.src || c.src === x.src))) return;
    const mv = moves[x.id];
    if (mv){ x.orig = x.date; x.date = mv.date; x.s = mv.s; x.e = mv.e; x.moved = true; }
    (byDate[x.date] = byDate[x.date] || []).push(x); all.push(x);
  };
  for (const r of RULES){
    const [code, kind, wd, s, e, from, to, except, only, label] = r;
    const dates = [];
    if (only) dates.push(...only); else for (let d = from; d <= to; d = addD(d, 7)) dates.push(d);
    const last = dates[dates.length - 1];
    for (const d of dates){
      if (except && except.includes(d)) continue;
      put({id:sid(d, code, kind, s), date:d, code, kind, wd, s:hm(s), e:hm(e), label: label || (code + ' ' + KINDNAME[kind]), ruleTo:last, src:'cal'});
    }
  }
  for (const e of E){
    if (e.kind !== 'sessAdd') continue;
    const label = e.label || ((e.code === 'OTHER' ? '' : e.code + ' ') + KINDNAME[e.sk]);
    if (e.date) put({id:'u|' + e.id + '|' + e.date, date:e.date, code:e.code, kind:e.sk, wd:dow(e.date), s:e.s, e:e.e, label, ruleTo:e.date, src:e.id});
    else {
      let d = e.from; while (dow(d) !== e.wd) d = addD(d, 1);
      for (; d <= e.to; d = addD(d, 7)) put({id:'u|' + e.id + '|' + d, date:d, code:e.code, kind:e.sk, wd:e.wd, s:e.s, e:e.e, label, ruleTo:e.to, src:e.id});
    }
  }
  all.sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.s - b.s);
  return {byDate, all};
}
function rebuildSessions(){ const r = buildSessions(S.edits); SESS = r.byDate; ALLSESS = r.all; }
const sessionsOn = d => (SESS[d] || []).slice().sort((a,b) => a.s - b.s);
const findSess = id => ALLSESS.find(x => x.id === id);
const covered = id => !!(S.att[id] || S.wat[id]);

/* ================= periods ================= */
const PERIODS = [
  {id:'AT',     name:'Autumn Term',                  from:'2026-09-28', to:'2026-12-11', tpl:'TERM_AT', wk:'2026-09-28'},
  {id:'XMAS',   name:'Christmas break',              from:'2026-12-12', to:'2027-01-03', tpl:'BREAK', v:'xmas'},
  {id:'JAN',    name:'January exams',                from:'2027-01-04', to:'2027-01-10', tpl:'EXAM', v:'jan'},
  {id:'WT',     name:'Winter Term',                  from:'2027-01-11', to:'2027-03-26', tpl:'TERM_WT', wk:'2027-01-11', reading:6},
  {id:'SPRING', name:'Spring break',                 from:'2027-03-27', to:'2027-04-25', tpl:'BREAK', v:'spring'},
  {id:'ST',     name:'Spring Term and summer exams', from:'2027-04-26', to:'2027-06-11', tpl:'EXAM', v:'summer', wk:'2027-04-26'},
  {id:'SUMMER', name:'Summer',                       from:'2027-06-12', to:'2027-09-26', tpl:'SUMMER'}
];
const OUTSIDE = {id:'OUT', name:'Outside the plan', tpl:'SUMMER'};
const HOLIDAYS = {'2026-12-24':'Christmas Eve','2026-12-25':'Christmas Day','2026-12-26':'Boxing Day','2026-12-31':"New Year's Eve",'2027-01-01':"New Year's Day"};
const periodOf = d => PERIODS.find(p => d >= p.from && d <= p.to) || OUTSIDE;
function periodLabel(d){
  const p = periodOf(d); let s = p.name;
  if (p.wk){ const w = Math.floor(daysBetween(p.wk, d) / 7) + 1; s += ' · week ' + w; if (p.reading === w) s += ' (reading week)'; }
  if (HOLIDAYS[d]) s += ' · ' + HOLIDAYS[d];
  return s;
}

/* ================= notes ================= */

/* ================= build a day ================= */
const overlap = (a, b) => a.s < b.e && b.s < a.e;
const cache = new Map();
const CONFLICTS = [];
function autoBlocks(d){
  const p = periodOf(d), w = dow(d), ss = sessionsOn(d);
  const campus = ss.some(x => x.kind === 'class' || x.kind === 'workshop');
  const ctx = {campus, p, d};
  const out = [], busy = [];
  for (const x of ss){
    if (x.kind === 'help') continue;
    const inPerson = campus && x.kind !== 'qa';
    let t = x.label, n = 'In person.';
    if (x.kind === 'lecture'){ t += inPerson ? ' · in person' : ' · watch at home'; n = inPerson ? N.inperson : N.watch; }
    if (x.kind === 'qa') n = N.qa;
    const b = {s:x.s, e:x.e, cat:'lse', t, n, id:x.id, sess:x, opt:x.kind === 'qa', plan: inPerson ? 'attend' : 'watch'};
    out.push(b); busy.push(b);
  }
  let leave = null;
  if (campus){
    const ip = ss.filter(x => x.kind === 'lecture' || x.kind === 'class' || x.kind === 'workshop');
    const first = Math.min(...ip.map(x => x.s)), last = Math.max(...ip.map(x => x.e));
    const t1 = {s:first - 45, e:first - 5, cat:'travel', t:'Cycle to campus', n:N.travel};
    const t2 = {s:last, e:last + 40, cat:'travel', t:'Cycle home', n:N.travel};
    leave = t1.s; out.push(t1, t2); busy.push(t1, t2);
  }
  let tpl;
  if (HOLIDAYS[d]) tpl = T.HOLIDAY(d);
  else if (w === 6) tpl = T.SAT(d, ctx, p);
  else if (w === 0) tpl = T.SUN(d, ctx, p);
  else tpl = T[p.tpl](d, ctx, p, w);
  tpl = [WAKE(), ...tpl, WIND()].filter(b => !(b.campusOnly && !campus) && !(b.homeOnly && campus))
    .map(b => (typeof b.t === 'function' ? o(b, {t:b.t(d, ctx)}) : b));
  for (const b of tpl.filter(b => !b.flex && !b.move)){
    if (busy.some(x => overlap(b, x))) CONFLICTS.push(d + ' fixed ' + tm(b.s) + ' ' + b.t);
    out.push(b); busy.push(b);
  }
  for (const b0 of tpl.filter(b => b.move)){
    const b = o(b0), len = b.e - b.s; let g = 0, hit;
    while ((hit = busy.find(x => overlap(b, x))) && g++ < 8){ b.s = hit.e; b.e = hit.e + len; b.moved = true; }
    if (busy.some(x => overlap(b, x)) || b.e > 22 * 60 + 30) CONFLICTS.push(d + ' move ' + tm(b0.s) + ' ' + b.t);
    out.push(b); busy.push(b);
  }
  for (const b of tpl.filter(b => b.flex)){
    let pieces = [[b.s, b.e]];
    for (const x of busy){
      pieces = pieces.flatMap(([a, z]) => (x.e <= a || x.s >= z) ? [[a, z]] : [[a, Math.max(a, x.s)], [Math.min(z, x.e), z]].filter(([p1, q]) => q > p1));
    }
    const untouched = pieces.length === 1 && pieces[0][0] === b.s && pieces[0][1] === b.e;
    for (const [a, z] of pieces) if (untouched || z - a >= 25) out.push(o(b, {s:a, e:z}));
  }
  out.sort((a, b) => a.s - b.s || a.e - b.e);
  for (const b of out) if (!b.id) b.id = 'b|' + d + '|' + tm(b.s) + '|' + b.cat;
  addCareer(d, out, p, w);
  for (const b of out) b.key = b.sess ? null : tm(b.s) + '|' + b.cat;
  out.campus = campus; out.leave = leave;
  return out;
}

/* Career: 1 hour each weekday (2 in the breaks), taken from free time, else from a plain study block. */
const CAREER_N = 'Internships, jobs and income: applications, networking emails you already owe, CV, a winter job. LSE CareerHub or general. Hard stop at the end.';
function addCareer(d, out, p, w){
  if (d < V3_START || w === 0 || w === 6 || HOLIDAYS[d]) return;
  let need = (p.tpl === 'BREAK' || p.tpl === 'SUMMER') ? S.prefs.careerBreakMin : S.prefs.careerMin;
  if (!(need > 0)) return;
  const take = (b, len, fromEnd) => {
    const s = fromEnd ? b.e - len : b.s, e = s + len;
    const cb = {s, e, cat:'career', t:'Career', n:CAREER_N, id:'b|' + d + '|' + tm(s) + '|career'};
    const i = out.indexOf(b);
    const rest = fromEnd ? [b.s, s] : [e, b.e];
    out.splice(i, 1, cb);
    if (rest[1] - rest[0] >= 15) out.push(o(b, {s:rest[0], e:rest[1], id:'b|' + d + '|' + tm(rest[0]) + '|' + b.cat}));
    need -= len;
  };
  const frees = () => out.filter(b => b.cat === 'free' && b.s >= 12 * 60 && b.e <= 22 * 60 + 30 && b.e - b.s >= 45).sort((a, b) => a.s - b.s);
  let f = frees().find(b => b.e - b.s >= need);
  if (f) take(f, need, false);
  else for (const b of frees()){ if (need <= 0) break; take(b, Math.min(need, b.e - b.s), false); }
  if (need >= 30){
    const st = out.filter(b => b.cat === 'study' && b.t === 'Study' && b.e - b.s >= need).sort((a, b) => b.s - a.s)[0];
    if (st) take(st, need, true);
    else {

function stOf(b, d){

function subOf(b, d, st){
  const p = [];

function sparkSvg(){
  const e = wEntries().slice(-42); if (e.length < 2) return '';
  const xs = e.map(x => daysBetween(e[0].d, x.d)), span = Math.max(1, xs[xs.length - 1]);
  const av = e.map(x => avg7(x.d)), vals = e.map(x => x.kg).concat(av.filter(v => v != null));
  const lo = Math.min(...vals) - .3, hi = Math.max(...vals) + .3, W = 300, H = 90;
  const X = i => (xs[i] / span * (W - 12) + 6).toFixed(1), Y = v => (H - 8 - (v - lo) / (hi - lo) * (H - 16)).toFixed(1);
  const pts = e.map((x, i) => '<circle cx="' + X(i) + '" cy="' + Y(x.kg) + '" r="2.4" fill="var(--muted)" opacity=".55"/>').join('');
  const line = av.map((v, i) => v == null ? null : X(i) + ',' + Y(v)).filter(Boolean).join(' ');
  return '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="Bodyweight trend">' + pts +
    (line.split(' ').length > 1 ? '<polyline points="' + line + '" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>' : '') + '</svg>';
}

/* ================= WEEK ================= */
const PX = 48 / 60, START = 7 * 60, END = 23 * 60;
function renderWeek(){
  const t = today(), ws = viewWeek || weekStart(t), m = nowM();
  const days = [0,1,2,3,4,5,6].map(i => addD(ws, i));
  const periods = [...new Set(days.map(d => periodOf(d).name))].join(' / ');
  let gut = '<div class="gut" style="height:' + (END - START) * PX + 'px">';
  for (let h = 8; h < 23; h++) gut += '<span style="top:' + (h * 60 - START) * PX + 'px">' + pad(h) + ':00</span>';
  gut += '</div>';
  const cols = days.map(d => {
    const bl = dayBlocks(d).map(b => {
      const s = Math.max(b.s, START), e = Math.min(b.e, END); if (e <= s) return '';
      const st = stOf(b, d);
      return '<div class="blk c-' + b.cat + (st.done ? ' done' : '') + (st.missed ? ' missed' : '') + '" style="top:' + (s - START) * PX + 'px;height:' + Math.max(10, (e - s) * PX - 2) + 'px" data-act="open" data-d="' + d + '" data-id="' + esc(b.id) + '" title="' + esc(tm(b.s) + '–' + tm(b.e) + ' ' + bTitle(b, d)) + '">' +
        (e - s >= 45 ? '<span class="t">' + tm(b.s) + '</span>' : '') + '<b>' + esc(bTitle(b, d)) + '</b></div>';
    }).join('');
    const nl = d === t && m >= START && m < END ? '<div class="nowline" style="top:' + (m - START) * PX + 'px"></div>' : '';
    return '<div class="col' + (d === t ? ' today' : '') + '" style="height:' + (END - START) * PX + 'px">' + bl + nl + '</div>';
  }).join('');
  const heads = '<div class="dh"></div>' + days.map(d => '<div class="dh' + (d === t ? ' today' : '') + '">' + dayName(d, true) + ' ' + dOf(d).getDate() + '<small>' + (dayBlocks(d).campus ? 'Campus' : 'Home') + '</small></div>').join('');
  const list = days.map(d => '<h3>' + dayName(d) + ' ' + niceDate(d) + ' <span class="muted" style="font-weight:600;font-size:14px">· ' + (dayBlocks(d).campus ? 'campus' : 'home') + '</span></h3>' + agendaHtml(d, false)).join('');
  view.innerHTML = '<div class="topbar" style="align-items:center"><div><h1>Week of ' + niceDate(ws) + '</h1><div class="sub">' + esc(periods) + '</div></div>' +
    '<div class="row-flex"><button class="btn small" data-act="wprev" aria-label="Previous week">' + ic('left', 'width:18px;height:18px') + '</button>' + (ws === weekStart(t) ? '' : '<button class="btn small" data-act="wtoday">This week</button>') + '<button class="btn small" data-act="wnext" aria-label="Next week">' + ic('right', 'width:18px;height:18px') + '</button></div></div>' +
    '<div class="wk">' + heads + gut + cols + '</div><div class="wklist">' + list + '</div>' +
    '<div style="margin-top:16px;max-width:560px">' + weekCard(ws, ws === weekStart(t) ? 'This week' : 'That week') + '</div>';
}

/* ================= DEADLINES ================= */
function renderDeadlines(){
  const n = now(), soon = new Date(n.getTime() + 3 * 864e5), wk = new Date(n.getTime() + 7 * 864e5);
  let all = allDL(); if (dlFilter !== 'ALL') all = all.filter(x => x.code === dlFilter);
  const over = all.filter(x => !isDone(x) && dueDate(x) < n);
  const week = all.filter(x => !isDone(x) && dueDate(x) >= n && dueDate(x) <= wk);
  const later = all.filter(x => !isDone(x) && dueDate(x) > wk);
  const done = all.filter(isDone).reverse();
  const row = x => { const dd = dueDate(x), d0 = isDone(x);
    return '<div class="li" style="' + (d0 ? 'opacity:.55' : '') + '"><button class="chk c-business' + (d0 ? ' on' : '') + '" data-act="dltick" data-id="' + esc(x.id) + '" aria-label="Done">' + ic('check') + '</button>' +
      '<span class="code">' + esc(x.code === 'BUS' ? 'BIZ' : x.code) + '</span><div class="tx"><div class="t">' + esc(x.title) + '</div>' + (x.note ? '<div class="s">' + esc(x.note) + '</div>' : '') +
      '<div class="s' + (!d0 && dd < n ? ' bad' : !d0 && dd <= soon ? ' bad' : '') + '">' + esc(dueWhen(x)) + ' · ' + (d0 ? 'done' : untilText(x)) + '</div></div>' + (x.custom ? '<button class="btn small danger" data-act="dldel" data-id="' + esc(x.id) + '">Delete</button>' : '') + '</div>'; };
  const codes = ['ALL','EC2A1','EC2B1','EC2C1','FM214','FM215','EC260P','BUS','OTHER'];
  const lab = c => c === 'ALL' ? 'All' : c === 'BUS' ? 'Business' : c === 'OTHER' ? 'Other' : c;
  const card = (title, list, empty) => '<section class="card"><h2>' + title + '<span class="r">' + list.length + '</span></h2>' + (list.length ? list.map(row).join('') : '<p class="empty">' + empty + '</p>') + '</section>';
  view.innerHTML = '<div class="topbar"><div><h1>Deadlines</h1><div class="sub">Add anything new from Moodle in your Sunday weekly review.</div></div><button class="pillbtn" data-act="add" data-k="dl">+ Add</button></div>' +
    '<div class="seg" style="margin:10px 0 14px">' + codes.map(c => '<button data-act="dlfilter" data-f="' + c + '" aria-pressed="' + (dlFilter === c) + '">' + lab(c) + '</button>').join('') + '</div>' +
    (over.length ? card('<span style="color:var(--bad)">Overdue</span>', over, '') : '') + card('Next 7 days', week, 'Nothing.') + card('Later', later, 'Nothing.') +
    (done.length ? '<section class="card"><details><summary><h2 style="margin:0">Done<span class="r">' + done.length + '</span></h2></summary>' + done.map(row).join('') + '</details></section>' : '');
}

const HOME = ['Mobility: hips, ankles, thoracic spine (5 min)','Core: dead bugs, plank, side plank (5 min)','Push-ups: 3 sets, 1–2 short of failure','Posture: wall slides, band pull-aparts or doorway stretch'];
function exHtml(ex, i, dr, total){
  const v = (dr.sets[ex.name] || []), last = lastSets(ex.name), up = upSuggestion(ex, last);
  const rx = (ex.sets > 1 || ex.lo ? ex.sets + ' × ' : '') + (ex.lo != null ? (ex.lo === ex.hi ? ex.lo : ex.lo + '–' + ex.hi) + (ex.unit === 'reps' ? '' : ' ' + ex.unit) : '') + (ex.side ? ' per side' : '') + (ex.rest ? ' · rest ' + ex.rest : '');
  let sets = '';
  if (ex.done){
    const on = !!(v[0] && v[0][1]);
    sets = '<button class="tk' + (on ? ' on' : '') + '" data-act="gdone" data-x="' + esc(ex.name) + '">' + (on ? 'Done ✓' : 'Mark done') + '</button>';
  } else for (let s = 0; s < ex.sets; s++){
    const r = v[s] || [], ph = last && last.sets[s] ? last.sets[s] : [];
    sets += '<div class="setrow"><span>Set ' + (s + 1) + '</span>' +
      '<input type="number" inputmode="decimal" step="0.5" min="0" placeholder="' + (ph[0] ? ph[0] + ' kg' : 'kg') + '" aria-label="' + esc(ex.name) + ' set ' + (s + 1) + ' weight in kg" value="' + (r[0] != null ? r[0] : '') + '" data-gx="' + esc(ex.name) + '" data-gs="' + s + '" data-gf="0">' +
      '<input type="number" inputmode="numeric" step="1" min="0" placeholder="' + (ph[1] ? ph[1] + ' ' + (ex.unit === 'reps' ? 'reps' : ex.unit) : ex.unit) + '" aria-label="' + esc(ex.name) + ' set ' + (s + 1) + ' ' + ex.unit + '" value="' + (r[1] != null ? r[1] : '') + '" data-gx="' + esc(ex.name) + '" data-gs="' + s + '" data-gf="1"></div>';
  }
  return '<div class="ex c-gym"><div class="hd"><div class="nm">' + esc(ex.name) + (ex.opt ? ' <span class="tag">optional</span>' : '') + '</div><div class="rx">' + (total ? (i + 1) + ' of ' + total + '<br>' : '') + esc(rx) + '</div></div>' +
    (ex.note ? '<div class="last">' + esc(ex.note) + '</div>' : '') +
    (last ? '<div class="last">Last time (' + niceDate(last.date, true) + '): ' + esc(fmtSets(ex, last.sets)) + '</div>' : (ex.done ? '' : '<div class="last">No log yet. Working sets only.</div>')) +
    (up ? '<div class="up">' + esc(up) + '</div>' : '') + sets +
    (ex.rest ? '<button class="btn small" data-act="rest" data-sec="' + restSec(ex.rest) + '">Start ' + ex.rest.split('–')[0] + ' rest</button>' : '') + '</div>';
}

}

  const n = now(), m = n.getHours() * 60 + n.getMinutes(), nd = nightDate();
  const windId = 'b|' + nd + '|22:30|routine';

    if (m >= 22 * 60 + 30 && m < 23 * 60) mode = 'soft';

  }
  const ov = $('#night'), B2 = S.alerts.bedtime;

  const head = mode === 'soft' ? 'Wind down' : 'It\'s past 11pm', text = mode === 'soft' ? 'Laptop shut by 23:00. Up at 07:00.' : 'Close the laptop and go to bed.';
  if (B2 === 'notify'){ ov.hidden = true; if (!nightSent.has(nd + mode)){ nightSent.add(nd + mode); alertUser(head, text); } return; }
  if (!nightSent.has(nd + mode)){ nightSent.add(nd + mode); notifySystem(head, text); }
  $('#nightClock').textContent = tm(m);
  if (mode !== nightMode){
    nightMode = mode;

      $('#nightGo').textContent = 'Shutting down now'; $('#nightSnooze').textContent = '10 more minutes';

      $('#nightGo').textContent = 'I\'m going to bed'; $('#nightSnooze').textContent = '5 more minutes (counts as a late night)';

  const n = now(), m = n.getHours() * 60 + n.getMinutes(), nd = nightDate();
  const onTime = n.getHours() >= 5 && m <= 23 * 60 + 10;
  S.nights[nd] = o(S.nights[nd] || {}, {bed:tm(m), late:!onTime || !!(S.nights[nd] && S.nights[nd].late)});
  if (onTime && !S.nights[nd].late) S.done['b|' + nd + '|22:30|routine'] = true;
  save(); $('#night').hidden = true; nightMode = null; render();
});
$('#nightSnooze').addEventListener('click', () => {
  const nd = nightDate(), hard = nightMode === 'hard';
  if (hard) S.nights[nd] = o(S.nights[nd] || {}, {late:true});
  S.snoozeUntil = Date.now() + OFFSET + (hard ? 5 : 10) * 6e4; save();
  $('#night').hidden = true; nightMode = null;
});

/* ================= loop ================= */
let lastMin = -1;
function busyTyping(){ const a = document.activeElement; return a && a.matches && a.matches('input,textarea,select'); }
function loop(){
  const m = nowM();
  checkAlerts(); checkNight();
  if (m !== lastMin){ lastMin = m; if (!$('#dlg').open && !busyTyping() && (TAB === 'today' || DEV.layout === 'C')) render(); else navHtml(); }
}

/* ================= boot ================= */
load();
rebuildSessions();
loadDev(); applyDev();
setTab((location.hash || '').slice(1) || 'today');
primeAlerts();
lastMin = nowM();
checkNight();
setInterval(loop, 15000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) loop(); });
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (DEV.theme === 'auto'){ applyDev(); render(); } }); } catch(e) {}
if (S.lastVersion !== APP_VERSION){ if (S.lastVersion) toast('Updated to version ' + APP_VERSION + '. Your ticks are all here.'); S.lastVersion = APP_VERSION; save(); }
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch(e) {}

/* ================= installable app ================= */
let wantReload = false;
function showUpdate(reg){
  $('#updateBar').hidden = false;
  $('#updateGo').onclick = () => { wantReload = true; if (reg.waiting) reg.waiting.postMessage('skip'); else location.reload(); };
}
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)){
  navigator.serviceWorker.register('./sw.js').then(reg => {
    SWREG = reg;
    if (reg.waiting && navigator.serviceWorker.controller) showUpdate(reg);
    reg.addEventListener('updatefound', () => { const w = reg.installing; if (w) w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) showUpdate(reg); }); });
    setInterval(() => reg.update().catch(() => {}), 60 * 60 * 1000);
  }).catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (wantReload){ wantReload = false; location.reload(); } });
}
function doInstall(){
  if (!deferredInstall){ toast('Use your browser menu: Install app.'); return; }
  deferredInstall.prompt();
  deferredInstall.userChoice.finally(() => { deferredInstall = null; $('#installBtn').hidden = true; if (TAB === 'setup') renderSetup(); });
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; $('#installBtn').hidden = false; if (TAB === 'setup') renderSetup(); });
window.addEventListener('appinstalled', () => { deferredInstall = null; $('#installBtn').hidden = true; toast('Installed. Open it from its icon.'); });
$('#installBtn').addEventListener('click', doInstall);

/* test hook */
window.__planner = {
  selfTest(){
    CONFLICTS.length = 0; cache.clear();
    for (let d = '2026-09-28'; d <= '2027-09-26'; d = addD(d, 1)) dayBlocks(d);
    const dowBad = ALLSESS.filter(x => dow(x.date) !== x.wd).map(x => x.id);
    const overlaps = [], noCareer = [];
    for (let d = '2026-10-11'; d <= '2027-09-26'; d = addD(d, 1)){
      const bl = dayBlocks(d);
      for (let i = 0; i < bl.length; i++) for (let j = i + 1; j < bl.length; j++)
        if (overlap(bl[i], bl[j]) && !(bl[i].opt || bl[j].opt)) overlaps.push(d + ' ' + tm(bl[i].s) + ' ' + bl[i].t + ' × ' + tm(bl[j].s) + ' ' + bl[j].t);
      if (d >= V3_START && dow(d) >= 1 && dow(d) <= 5 && !HOLIDAYS[d] && !bl.some(b => b.cat === 'career')) noCareer.push(d);
    }
    return {conflicts: CONFLICTS.slice(), dowBad, overlaps, noCareer, sessions: ALLSESS.length, deadlines: DL.length};
  },
  day: d => dayBlocks(d).map(b => tm(b.s) + '-' + tm(b.e) + ' [' + b.cat + '] ' + b.t + ' {' + b.id + '}'),
  state: () => S, weekText, behind: () => behindLectures().map(x => x.id), plan: () => CP, gp: () => GP
};
})();
