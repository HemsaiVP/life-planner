  if (el.dataset.gsday){ const x = S.gym.sessions.find(z => z.id === el.dataset.gsday); if (x){ x.day = +el.value; save(); cache.clear(); render(); toast('Changed to Day ' + x.day + '.'); } return; }
  if (el.dataset.pref){
    if (el.dataset.pref === 'gymnext'){ S.gym.manual = {day:+el.value, ids:S.gym.sessions.map(x => x.id)}; save(); cache.clear(); render(); toast('Next session: Day ' + gymNext() + '.'); return; }
    let n = parseFloat(el.value); if (!(n >= 0)) return;
    const k = el.dataset.pref;
    // goals can't be set past the safety lines
    if (k === 'waterL' && n * 1000 > waterWarnMl()){ n = Math.floor(waterWarnMl() / 250) / 4; el.value = n; S.prefs[k] = n; save(); cache.clear(); toast('More than ' + mlText(waterWarnMl()) + ' a day is more than you need. Set to ' + mlText(n * 1000) + '.'); return; }
    if ((k === 'proteinLo' || k === 'proteinHi') && n > protMax()){ n = protMax(); el.value = n; S.prefs[k] = n; save(); cache.clear(); toast('Over ' + protMax() + ' g is above what is considered safe for your weight. Set to ' + n + ' g.'); return; }
    S.prefs[k] = n; save(); cache.clear(); toast('Saved.'); return;
  }
  if (el.dataset.fqi != null){ const L = dayLog(foodDay || today()), i = +el.dataset.fqi, e = L[i], q = parseFloat(el.value); if (!e || !(q > 0)){ render(); return; }
    guardEntry(o(e, {q}), () => { pFrom = foodTotals(L).p; e.q = q; save(); render(); },
      () => { render(); const x = document.querySelector('[data-fqi="' + i + '"]'); if (x){ x.focus(); x.select(); } });
    return; }
  if (el.dataset.usf != null){ const e = S.food.usual[+el.dataset.usf]; if (e){ e.f = el.value; e.q = foodOf(el.value).def; save(); render(); } return; }
  if (el.dataset.usq != null){ const i = +el.dataset.usq, e = S.food.usual[i], q = parseFloat(el.value); if (!e || !(q > 0)){ render(); return; }
    guardEntry(o(e, {q}), () => { e.q = q; save(); render(); }, () => { render(); const x = document.querySelector('[data-usq="' + i + '"]'); if (x){ x.focus(); x.select(); } });
    return; }
  if (el.dataset.usm != null){ const e = S.food.usual[+el.dataset.usm]; if (e){ e.m = el.value; save(); render(); } return; }
  if (el.dataset.fsel != null){ const fd = foodOf(el.value), f = el.form; if (fd && f){ f.elements.q.value = fd.def; const u = f.querySelector('[data-funit]'); if (u) u.textContent = unitOf(fd); } return; }
});

/* ================= alerts ================= */
let AC = null, SWREG = null, deferredInstall = null;
function unlockAudio(){ if (!S.alerts.sound) return; try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch(e) {} }
function chime(){
  if (!S.alerts.sound) return;
  unlockAudio(); if (!AC) return;
  try { const t0 = AC.currentTime; [660, 880].forEach((f, i) => { const os = AC.createOscillator(), g = AC.createGain(); os.type = 'sine'; os.frequency.value = f;
    g.gain.setValueAtTime(0, t0 + i * .18); g.gain.linearRampToValueAtTime(.18, t0 + i * .18 + .02); g.gain.exponentialRampToValueAtTime(.001, t0 + i * .18 + .5);
    os.connect(g).connect(AC.destination); os.start(t0 + i * .18); os.stop(t0 + i * .18 + .55); }); } catch(e) {}
}
function notifySystem(title, body, force){
  const A = S.alerts;
  if (!A.system || !('Notification' in window) || Notification.permission !== 'granted') return;
  if (!force && document.visibilityState === 'visible' && document.hasFocus()) return;
  const opts = {body, icon:'icons/slate-192.png', badge:'icons/slate-192.png', tag:'planner', renotify:true, silent:!A.sound && !A.vibrate};
  if (A.vibrate) opts.vibrate = [180, 90, 180];
  if (SWREG && SWREG.showNotification) SWREG.showNotification(title, opts).catch(() => {});
  else { try { new Notification(title, opts); } catch(e) {} }
}
function alertUser(title, body, force){
  const A = S.alerts;
  if (A.banner || force){
    const bn = $('#banner'); bn.innerHTML = '<b>' + esc(title) + '</b>' + esc(body); bn.hidden = false;
    clearTimeout(alertUser.t); alertUser.t = setTimeout(() => bn.hidden = true, 60000);
    document.title = '● ' + title;
    clearTimeout(alertUser.tt); alertUser.tt = setTimeout(() => document.title = 'Slate', 90000);
  }
  chime();
  notifySystem(title, body, force);
}
$('#banner').addEventListener('click', () => { $('#banner').hidden = true; document.title = 'Slate'; });
const alerted = new Set();
function primeAlerts(){ const m = nowM(); for (const b of dayBlocks(today())) if (b.s <= m) alerted.add(today() + b.id + 's'); }
function checkAlerts(){
  const t = today(), m = nowM(), A = S.alerts;
  for (const b of dayBlocks(t)){
    if (b.live) continue;
    if (b.cat === 'travel'){
      if (A.leave && b.t === 'Cycle to campus' && m >= b.s - 5 && m < b.s && !alerted.has(t + b.id + 'p')){
        alerted.add(t + b.id + 'p'); alertUser('Leave in ' + (b.s - m) + ' min', 'Cycle to campus at ' + tm(b.s) + '.');
      }
      continue;
    }
    if (A.cats[b.cat] && m >= b.s && m < b.s + 3 && !alerted.has(t + b.id + 's')){
      alerted.add(t + b.id + 's'); alertUser('Now: ' + b.t, 'Until ' + tm(b.e) + '.');
    }
  }
}

/* ================= night lock ================= */
function nightDate(){ const n = now(); return n.getHours() < 5 ? iso(new Date(n.getFullYear(), n.getMonth(), n.getDate() - 1)) : iso(n); }
let nightMode = null; const nightSent = new Set();
function checkNight(){
  const n = now(), m = n.getHours() * 60 + n.getMinutes(), nd = nightDate();
  const windId = 'b|' + nd + '|22:30|routine';
  let mode = null;
  if (!S.done[windId] && !(S.nights[nd] && S.nights[nd].bed) && Date.now() + OFFSET >= (S.snoozeUntil || 0)){
    if (m >= 22 * 60 + 30 && m < 23 * 60) mode = 'soft';
    else if (m >= 23 * 60 || n.getHours() < 5) mode = 'hard';
  }
  const ov = $('#night'), B2 = S.alerts.bedtime;
  if (!mode || B2 === 'off'){ ov.hidden = true; nightMode = null; return; }
  const head = mode === 'soft' ? 'Wind down' : 'It\'s past 11pm', text = mode === 'soft' ? 'Laptop shut by 23:00. Up at 07:00.' : 'Close the laptop and go to bed.';
  if (B2 === 'notify'){ ov.hidden = true; if (!nightSent.has(nd + mode)){ nightSent.add(nd + mode); alertUser(head, text); } return; }
  if (!nightSent.has(nd + mode)){ nightSent.add(nd + mode); notifySystem(head, text); }
  $('#nightClock').textContent = tm(m);
  if (mode !== nightMode){
    nightMode = mode;
    if (mode === 'soft'){
      $('#nightHead').textContent = 'Wind down.'; $('#nightText').textContent = 'Laptop shut by 23:00. Lay out tomorrow, then read. Up at 07:00.';
      $('#nightGo').textContent = 'Shutting down now'; $('#nightSnooze').textContent = '10 more minutes';
    } else {
      $('#nightHead').textContent = 'It\'s past 11pm.'; $('#nightText').textContent = 'Sleep is guardrail 1. Close the laptop now. Anything unfinished goes in tomorrow\'s first study block.';
      $('#nightGo').textContent = 'I\'m going to bed'; $('#nightSnooze').textContent = '5 more minutes (counts as a late night)';
    }
    chime();
  }
  ov.hidden = false;
}
$('#nightGo').addEventListener('click', () => {
  const n = now(), m = n.getHours() * 60 + n.getMinutes(), nd = nightDate();
  const onTime = n.getHours() >= 5 && m <= 23 * 60 + 10;
  S.nights[nd] = o(S.nights[nd] || {}, {bed:tm(m), late:!onTime || !!(S.nights[nd] && S.nights[nd].late)});
  if (onTime && !S.nights[nd].late) S.done['b|' + nd + '|22:30|routine'] = true;
  save(); $('#night').hidden = true; nightMode = null; render();
});
$('#nightSnooze').addEventListener('click', () => {
  const nd = nightDate(), hard = nightMode === 'hard';
  if (hard) S.nights[nd] = o(S.nights[nd] || {}, {late:true});
  S.snoozeUntil = Date.now() + OFFSET + (hard ? 5 : 10) * 6e4; save();
  $('#night').hidden = true; nightMode = null;
});

/* ================= loop ================= */
let lastMin = -1;
function busyTyping(){ const a = document.activeElement; return a && a.matches && a.matches('input,textarea,select'); }
function loop(){

    if (!$('#dlg').open && !busyTyping() && (boardChanged || TAB === 'today' || DEV.layout === 'C')) render(); else navHtml();

}
